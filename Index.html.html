/* =====================================================
   GLOSSARY
===================================================== */
const GLOSSARY = [
["Accessibility (a11y)","Designing so people with visual, motor, auditory, or cognitive differences can use the product. Legally required in many contexts; ethically required in all."],
["Affordance","A visual cue that tells you how something works — a raised button 'affords' pressing."],
["Breakpoint","A screen width where a responsive layout changes (e.g., sidebar collapses at 900px — resize this window to see one)."],
["Card","A contained surface grouping related content, like the panels on this page."],
["CTA (Call To Action)","The primary action you want a user to take — usually the loudest button on the screen."],
["Design system","A shared library of colors, type, spacing, and components that keeps a product consistent."],
["Empty state","What a screen shows when there's no data yet. Good ones explain what to do next."],
["Fitts's Law","Bigger + closer targets are faster to hit. Governs button size and placement."],
["Gestalt principles","Psychology of how we group visuals: proximity, similarity, closure, continuity."],
["Grid","Invisible columns and rows that align a layout. 12 columns is the desktop standard."],
["Heuristic evaluation","Reviewing an interface against a checklist of known usability principles (Nielsen's 10 are the classic set)."],
["Hick's Law","More choices = slower decisions. Argues for short menus and progressive disclosure."],
["Hierarchy","The intentional ordering of what gets noticed first, second, third."],
["HSL","Hue / Saturation / Lightness — a human-friendly way to describe and modify color."],
["Information architecture (IA)","How content is organized, labeled, and structured so people can find things."],
["Jakob's Law","Users expect your product to work like the products they already know."],
["Kerning / letter-spacing","The space between letters. Wide spacing suits small caps labels; tight suits big headlines."],
["Mockup","A high-fidelity static picture of the final design — real colors, type, and content."],
["Persona","A research-based sketch of a typical user: goals, context, frustrations."],
["Progressive disclosure","Showing only essential options first, revealing complexity on demand."],
["Prototype","A clickable simulation of a design used for testing before any code is written."],
["Semantic colors","Colors with learned meanings: green success, amber warning, red danger."],
["Type scale","A set of font sizes generated from a ratio so they relate harmoniously."],
["Usability testing","Watching real people attempt tasks with your design, without helping them."],
["User flow","The step-by-step path a user takes to complete a goal, e.g., search → select → pay."],
["WCAG","Web Content Accessibility Guidelines — the standard defining contrast ratios and other accessibility rules."],
["Whitespace","Empty space used deliberately to group, separate, and emphasize."],
["Wireframe","A low-fidelity structural blueprint of a screen — gray boxes over aesthetics."],
["A/B test","Showing two versions to different user groups and measuring which performs better. Behavioral + quantitative."],
["Affinity mapping","Clustering raw research observations into named themes — usually with sticky notes in FigJam or Miro."],
["ARIA","Accessible Rich Internet Applications — HTML attributes adding semantics for assistive tech. Rule one: prefer native elements."],
["Atomic design","Brad Frost's model: atoms → molecules → organisms → templates → pages."],
["Auto Layout","Figma's responsive container system: direction, gap, padding, and hug/fill/fixed sizing. Flexbox thinking for designers."],
["Card sorting","Users group content into piles that make sense to them — open (they name groups) or closed (you provide them)."],
["Component / instance","A master element and its live-linked copies. Edit the master, every instance updates."],
["Constraints (Figma)","Rules pinning elements to frame edges so layouts survive resizing."],
["Design QA","Checking the built product against the design before release."],
["Design system","Tokens + components + patterns + documentation: the single source of truth for a product's design."],
["Design token","A named design decision like color/action/primary. Semantic tokens point at primitive values, making theming cheap."],
["DesignOps","The discipline of tooling, process, and rituals that lets design teams scale."],
["Dev Mode","Figma's engineer handoff view: exact measurements, tokens, and code snippets from any layer."],
["Easing","The acceleration curve of an animation. Ease-out for entrances, ease-in for exits — never linear for UI."],
["FigJam","Figma's whiteboard product for workshops, flows, and affinity mapping. Miro is the main alternative."],
["First-click test","Show a screen, give a task, record only the first click — a strong predictor of task success."],
["Heatmap","A visualization of where users click, tap, or look. Hotjar is the classic tool."],
["HIG","Apple's Human Interface Guidelines — the iOS/macOS platform rulebook. Android's counterpart is Material Design."],
["JTBD (Jobs-to-be-done)","Framing products as things users 'hire' to make progress — motivation over demographics."],
["Journey map","A visualization of a user's steps, thoughts, and emotions across an experience, exposing pain points."],
["Material Design","Google's design system and platform conventions for Android and the web."],
["Microinteraction","A tiny complete interactive moment: trigger → rules → feedback → loops."],
["Mobile-first","Designing the narrow, constrained version first, then letting layouts earn complexity with space."],
["POUR","WCAG's four pillars: Perceivable, Operable, Understandable, Robust."],
["Skip link","A hidden-until-focused link letting keyboard users jump past navigation to content."],
["Smart Animate","Figma's transition that matches layers by name across frames and tweens between them."],
["Storybook","Where engineering teams build and document the coded versions of design-system components."],
["Thumb zone","The bottom-of-screen region a thumb reaches comfortably — where mobile primary actions belong."],
["Tree testing","Testing findability in a bare menu structure, with all visual design stripped away."],
["Variant","One component in multiple switchable states or styles: primary/secondary, hover/disabled, S/M/L."]
];

===================================================== */
const NAV = [
  {label:"Studio", items:[
    {id:"home", name:"Home", icon:"⌂"}
  ]},
  {label:"Curriculum", items: MODULES.map(m=>({id:m.id, name:m.title, nnum:m.num}))},
  {label:"Hands-on", items:[
    {id:"labs", name:"Labs"},
    {id:"challenges", name:"Challenges"},
    {id:"playground", name:"Playground"}
  ]},
  {label:"Reference", items:[
    {id:"tools", name:"Tool Atlas"},
    {id:"glossary", name:"Glossary"},
    {id:"progress", name:"My Progress"}
  ]}
];
let currentView = "home";

function moduleDone(m){
  return m.lessons.every(l=>S.lessons.includes(l.id)) && S.quizzes[m.id]!==undefined;
}

function renderNav(){
  const nav=document.getElementById("sidenav");
  nav.innerHTML = NAV.map(sec=>
    `<div class="navlabel">${sec.label}</div>`+
    sec.items.map(it=>{
      const mod = MODULES.find(m=>m.id===it.id);
      const done = mod ? moduleDone(mod) : false;
      return `<button class="navitem ${currentView===it.id?'active':''} ${done?'done':''}" data-nav="${it.id}">
        ${it.nnum?`<span class="nnum">${it.nnum}</span>`:`<span class="dot"></span>`}
        ${it.name}${done?' ✓':''}
      </button>`;
    }).join("")
  ).join("");
}
document.getElementById("sidenav").addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]");
  if(b) go(b.dataset.nav);
});
function go(view){
  currentView=view;
  renderNav();
  const main=document.getElementById("main");
  main.scrollTop=0;
  if(view==="home") return renderHome();
  if(view==="labs") return renderLabs();
  if(view==="challenges") return renderChallenges();
  if(view==="playground") return renderPlayground();
  if(view==="tools") return renderTools();
  if(view==="glossary") return renderGlossary();
  if(view==="progress") return renderProgress();
  const mod=MODULES.find(m=>m.id===view);
  if(mod) return renderModule(mod);
  renderHome();
}

      const m7=MODULES.find(m=>m.id==="m7");

function renderQuiz(box, mod){
  const prev=S.quizzes[mod.id];
  box.innerHTML = mod.quiz.map((q,qi)=>`
    <div class="q" data-q="${qi}">
      <div class="qt">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<label class="opt"><input type="radio" name="q${mod.id}${qi}" value="${oi}"><span>${o}</span></label>`).join("")}
      <div class="qwhy" style="display:none;font-size:13px;color:var(--muted);padding:6px 2px 0"></div>
    </div>`).join("") +
    `<button class="btn" id="qsubmit">Check answers</button>
     ${prev!==undefined?`<span style="margin-left:14px;font-family:var(--mono);font-size:13px;color:var(--muted)">best: ${prev}/${mod.quiz.length}</span>`:""}
     <div class="quizresult" id="qresult"></div>`;
  box.querySelector("#qsubmit").addEventListener("click",()=>{
    let score=0, answered=0;
    mod.quiz.forEach((q,qi)=>{
      const qEl=box.querySelector(`[data-q="${qi}"]`);
      const sel=qEl.querySelector("input:checked");
      const opts=qEl.querySelectorAll(".opt");
      opts.forEach(o=>o.classList.remove("correct","wrong"));
      const why=qEl.querySelector(".qwhy");
      if(sel){
        answered++;
        const val=+sel.value;
        if(val===q.a){score++; opts[val].classList.add("correct");}
        else{opts[val].classList.add("wrong"); opts[q.a].classList.add("correct");}
        why.style.display="block";
        why.textContent="→ "+q.why;
      }
    });
    if(answered<mod.quiz.length){ toast("Answer all "+mod.quiz.length+" questions first"); return; }
    const res=box.querySelector("#qresult");
    res.textContent = score+"/"+mod.quiz.length+(score===mod.quiz.length?" — flawless.":score>=mod.quiz.length-1?" — strong.":" — review and retake anytime.");
    const first = S.quizzes[mod.id]===undefined;
    if(first){
      S.quizzes[mod.id]=score;
      addXP(score*10,"quiz banked");
    } else if(score>S.quizzes[mod.id]){
      S.quizzes[mod.id]=score; saveState();
    }
    if(score/mod.quiz.length>=0.8) award("Quiz Whiz");
    renderNav();
  });
}

/* --- contrast math --- */
function hexToRgb(h){ h=h.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lum(rgb){
  const a=rgb.map(v=>{v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
function ratio(h1,h2){
  const l1=lum(hexToRgb(h1)), l2=lum(hexToRgb(h2));
  const hi=Math.max(l1,l2), lo=Math.min(l1,l2);
  return (hi+0.05)/(lo+0.05);
}

function labFitts(slot){
  slot.innerHTML=`<div class="labpanel">
    <h2 style="margin-top:0">Fitts's Law Range</h2>
    <p style="font-size:14px;color:var(--muted)">Hit 12 targets as fast as you can. Sizes and positions are random. Afterwards we compare your average time on <strong style="color:var(--text)">small</strong> vs <strong style="color:var(--text)">large</strong> targets — the law predicts the winner.</p>
    <button class="btn" id="fStart">Start round</button>
    <div class="arena" id="fArena"><div class="arenamsg">targets appear here</div></div>
    <div id="fOut" style="margin-top:14px;font-family:var(--mono);font-size:13.5px"></div></div>`;
  let times=[], sizes=[], n=0, t0=0;
  const arena=slot.querySelector("#fArena");
  function next(){
    arena.innerHTML="";
    if(n>=12){ finish(); return; }
    const size = 22 + Math.round(Math.random()*66);
    const x = Math.random()*(arena.clientWidth-size-8)+4;
    const y = Math.random()*(arena.clientHeight-size-8)+4;
    const b=document.createElement("button");
    b.className="target";
    b.style.cssText=`width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
    b.setAttribute("aria-label","target "+(n+1));
    b.addEventListener("click",()=>{
      times.push(performance.now()-t0); sizes.push(size);
      n++; next();
    });
    arena.appendChild(b);
    t0=performance.now();
  }
  function finish(){
    arena.innerHTML=`<div class="arenamsg">round complete — results below</div>`;
    let sm=[], lg=[];
    times.forEach((t,i)=>{ (sizes[i]<52?sm:lg).push(t); });
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
    const total=Math.round(times.reduce((x,y)=>x+y,0));
    slot.querySelector("#fOut").innerHTML=
      `total: <b style="color:var(--peach)">${(total/1000).toFixed(2)}s</b> · `+
      `small targets (&lt;52px): <b style="color:var(--vermilion)">${avg(sm)}ms avg</b> · `+
      `large targets: <b style="color:var(--ok)">${avg(lg)}ms avg</b><br>`+
      `<span style="color:var(--muted)">${avg(sm)>avg(lg)?"Fitts wins again — big targets were faster for you, just as the law predicts. Now you know why primary buttons are big.":"Interesting — you beat the trend this round. Run it again; over more trials the law almost always shows."}</span>`;
  }
  slot.querySelector("#fStart").addEventListener("click",()=>{ times=[];sizes=[];n=0; next(); });
}

function labHick(slot){
  slot.innerHTML=`<div class="labpanel">
    <h2 style="margin-top:0">Hick's Law Timer</h2>
    <p style="font-size:14px;color:var(--muted)">Three rounds. Each time, click the button labeled <strong style="color:var(--peach)">TARGET</strong> — first among 4 options, then 9, then 16. Watch your decision time climb with the choice count.</p>
    <button class="btn" id="hStart">Start</button>
    <div class="hickgrid" id="hGrid"></div>
    <div id="hOut" style="margin-top:14px;font-family:var(--mono);font-size:13.5px"></div></div>`;
  const rounds=[4,9,16]; let ri=0, results=[], t0=0;
  const grid=slot.querySelector("#hGrid");
  const decoys=["OPTION","CHOICE","SELECT","ITEM","ENTRY","PICK","THING","FIELD","VALUE","LABEL","INPUT","TOKEN","POINT","BLOCK","UNIT"];
  function round(){
    const n=rounds[ri];
    grid.style.gridTemplateColumns=`repeat(${Math.ceil(Math.sqrt(n))},1fr)`;
    const tpos=Math.floor(Math.random()*n);
    grid.innerHTML="";
    for(let i=0;i<n;i++){
      const b=document.createElement("button");
      b.className="hickbtn";
      b.textContent = i===tpos ? "TARGET" : decoys[(i*7+ri*3)%decoys.length];
      b.addEventListener("click",()=>{
        if(i!==tpos){ b.style.borderColor="var(--vermilion)"; return; }
        results.push({n, ms:Math.round(performance.now()-t0)});
        ri++;
        if(ri<rounds.length) round(); else finish();
      });
      grid.appendChild(b);
    }
    t0=performance.now();
  }
  function finish(){
    grid.innerHTML="";
    slot.querySelector("#hOut").innerHTML =
      results.map(r=>`${r.n} options → <b style="color:var(--peach)">${r.ms}ms</b>`).join(" · ")+
      `<br><span style="color:var(--muted)">More options, more milliseconds. Now multiply that hesitation by every menu, every settings page, every pricing table your users meet — and you understand why editors say "cut, cut, cut."</span>`;
  }
  slot.querySelector("#hStart").addEventListener("click",()=>{ ri=0; results=[]; slot.querySelector("#hOut").textContent=""; round(); });
}

function labStates(slot){

    ["hover","Pointer feedback (desktop only — phones have no hover!). Slightly brighter or lifted.","background:#ff4a2e;color:#fff2ef;box-shadow:0 4px 14px rgba(236,48,19,.45);"],
    ["focus","Keyboard position indicator. A visible ring — never remove it.","background:#ec3013;color:#fff2ef;outline:3px solid #ff9784;outline-offset:3px;"],

    ["disabled","Unavailable, and honest about it. Reduced contrast, no pointer events — but ideally explain WHY nearby.","background:#4a4443;color:#8a8482;cursor:not-allowed;"],
    ["loading","Action in progress. The label yields to a spinner; the button locks to prevent double-submits.","background:#ec3013;color:#fff2ef;opacity:.85;"],

function labEasing(slot){
  slot.innerHTML=`<div class="labpanel">
    <h2 style="margin-top:0">Motion &amp; Easing Lab</h2>
    <p style="font-size:14px;color:var(--muted)">Four dots, four easing curves, one race. Adjust duration, hit replay, and watch — <strong style="color:var(--text)">linear</strong> feels robotic while <strong style="color:var(--text)">ease-out</strong> feels alive. This is why motion specs always name a curve.</p>
    <div class="ctlrow">
      <label class="ctl">duration <span id="ezV">300ms</span><input type="range" id="ezD" min="100" max="1200" step="50" value="300"></label>
      <button class="btn sm" id="ezGo">▶ Replay</button>
    </div>
    <div id="ezTrack"></div>
    <p style="font-size:13px;color:var(--muted);margin-top:12px">Rules of thumb: UI transitions live at 150–400ms · entrances use ease-out · exits use ease-in · linear is for progress bars and nothing else.</p></div>`;
  const curves=[["linear","linear"],["ease-in","cubic-bezier(.5,0,1,1)"],["ease-out","cubic-bezier(0,0,.4,1)"],["ease-in-out","cubic-bezier(.6,0,.4,1)"]];
  slot.querySelector("#ezTrack").innerHTML=curves.map(([n],i)=>`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <span style="font-family:var(--mono);font-size:11px;color:var(--muted);width:86px">${n}</span>
      <div style="flex:1;height:34px;background:var(--ink);border:1px solid var(--line-soft);border-radius:99px;position:relative">
        <div class="ezdot" data-ei="${i}" style="position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:99px;background:${i===2?'var(--peach)':'var(--vermilion)'}"></div>
      </div>
    </div>`).join("");
  const run=()=>{
    const d=+slot.querySelector("#ezD").value;
    slot.querySelector("#ezV").textContent=d+"ms";
    slot.querySelectorAll(".ezdot").forEach(dot=>{
      const i=+dot.dataset.ei;
      dot.style.transition="none"; dot.style.left="4px";
      void dot.offsetWidth;
      dot.style.transition=`left ${d}ms ${curves[i][1]}`;
      dot.style.left="calc(100% - 28px)";
    });
  };
  slot.querySelector("#ezGo").addEventListener("click",run);
  slot.querySelector("#ezD").addEventListener("input",()=>{slot.querySelector("#ezV").textContent=slot.querySelector("#ezD").value+"ms";});
  setTimeout(run,300);
}

function labShortcuts(slot){
  const CARDS=[
    ["Duplicate selection",["⌘/Ctrl + D","⌘/Ctrl + J","Alt + P"],0],
    ["Create a component",["⌘/Ctrl + Shift + B","⌘/Ctrl + Alt + K","F9"],1],
    ["Add Auto Layout to selection",["Shift + A","⌘/Ctrl + L","Alt + A"],0],
    ["Group selection",["⌘/Ctrl + G","Shift + G","⌘/Ctrl + B"],0],
    ["Frame tool",["F","R","A"],0],
    ["Rectangle tool",["Q","R","B"],1],
    ["Text tool",["T","X","W"],0],
    ["Toggle Dev Mode",["Shift + D","⌘/Ctrl + M","Alt + V"],0],
    ["Zoom to fit everything",["Shift + 1","⌘/Ctrl + 0","Z"],0],
    ["Copy properties / paste properties",["⌘/Ctrl + Alt + C / V","⌘/Ctrl + P / O","Shift + C / V"],0],
    ["Show/hide the UI panels",["⌘/Ctrl + \\\\","Tab twice","F11"],0],
    ["Detach an instance from its component",["⌘/Ctrl + Alt + B","⌘/Ctrl + Shift + X","Alt + D"],0]
  ];
  slot.innerHTML=`<div class="labpanel">
    <h2 style="margin-top:0">Figma Shortcut Trainer</h2>
    <p style="font-size:14px;color:var(--muted)">Working designers hit these dozens of times an hour — muscle memory is real speed. Ten flashcards per round; pick the right shortcut.</p>
    <button class="btn" id="scStart">Start round</button>
    <div id="scCard" style="margin-top:16px"></div>
    <div id="scOut" style="margin-top:12px;font-family:var(--mono);font-size:13.5px"></div></div>`;
  let deck=[], qi=0, score=0;
  const box=slot.querySelector("#scCard");
  function draw(){
    if(qi>=deck.length){
      box.innerHTML="";
      slot.querySelector("#scOut").innerHTML=`round complete — <b style="color:var(--peach)">${score}/${deck.length}</b><br><span style="color:var(--muted)">${score>=8?"That's working-designer speed. ":"Run it again — repetition IS the trainer. "}Full list lives in Figma under the ? menu → Keyboard shortcuts.</span>`;
      return;
    }
    const [act,opts,ans]=deck[qi];
    box.innerHTML=`<div class="card"><div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px">card ${qi+1}/${deck.length}</div>
      <div style="font-family:var(--display);font-size:19px;margin-bottom:14px">${act}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${opts.map((o,i)=>`<button class="btn ghost sm" data-sci="${i}" style="font-family:var(--mono)">${o}</button>`).join("")}</div>
      <div id="scFb" style="margin-top:10px;font-size:13px;font-family:var(--mono)"></div></div>`;
    box.querySelectorAll("[data-sci]").forEach(b=>b.addEventListener("click",()=>{
      const i=+b.dataset.sci, fb=box.querySelector("#scFb");
      if(i===ans){ score++; fb.textContent="✓ correct"; fb.style.color="var(--ok)"; }
      else { fb.textContent="✗ it's "+opts[ans]; fb.style.color="var(--vermilion)"; }
      box.querySelectorAll("[data-sci]").forEach(x=>x.disabled=true);
      setTimeout(()=>{qi++;draw();},700);
    }));
  }
  slot.querySelector("#scStart").addEventListener("click",()=>{
    deck=[...CARDS].sort(()=>Math.random()-.5).slice(0,10);
    qi=0; score=0; slot.querySelector("#scOut").textContent="";
    draw();
  });
}

function renderChallenges(){
  const v=el(`
    <div class="eyebrow">Critique training</div>
    <h1>Challenges</h1>
    <p class="lede">Real designers develop an eye by finding what's broken. Each challenge shows a flawed interface; exactly three of the six critiques are legitimate. Choose your three and submit — 40 XP per solve. These double as training for the "app critique" round in design interviews (Module 13).</p>
    <div id="chlist" style="margin-top:24px"></div>
  `);
  const list=v.querySelector("#chlist");
  CHALLENGES.forEach(ch=>{
    const solved=S.challenges.includes(ch.id);
    const d=document.createElement("div");
    d.className="card"; d.style.marginBottom="22px";
    d.innerHTML=`<h3 style="margin-top:0;color:var(--text)">${ch.title} ${solved?'<span style="color:var(--ok);font-size:13px;font-family:var(--mono)">✓ solved</span>':''}</h3>
      <p style="font-size:14px;color:var(--muted)">${ch.intro}</p>
      <div class="chmock">${ch.mock}</div>
      <div class="chopts">${ch.opts.map((o,i)=>`
        <label class="chopt"><input type="checkbox" data-ci="${i}"><span>${o.t}</span></label>
        <div class="chwhy" data-cw="${i}" style="display:none;font-size:12.5px;color:var(--muted);margin:-4px 0 10px 34px"></div>`).join("")}</div>
      <button class="btn sm" data-chsub="${ch.id}">Submit critique</button>
      <span class="chres" style="margin-left:12px;font-family:var(--mono);font-size:13px"></span>`;
    d.querySelector("[data-chsub]").addEventListener("click",()=>{
      const checks=[...d.querySelectorAll("input[data-ci]")];
      const chosen=checks.filter(c=>c.checked).map(c=>+c.dataset.ci);
      if(chosen.length!==3){ toast("Pick exactly 3 critiques"); return; }
      let right=0;
      ch.opts.forEach((o,i)=>{
        const lab=checks[i].closest(".chopt");
        lab.classList.remove("correct","wrong");
        const why=d.querySelector(`[data-cw="${i}"]`);
        if(chosen.includes(i)){
          lab.classList.add(o.ok?"correct":"wrong");
          why.style.display="block"; why.textContent="→ "+o.why;
          if(o.ok) right++;
        } else if(o.ok){
          lab.classList.add("correct");
          why.style.display="block"; why.textContent="→ (missed) "+o.why;
        }
      });
      const res=d.querySelector(".chres");
      if(right===3){
        res.textContent="3/3 — sharp eye."; res.style.color="var(--ok)";
        if(!S.challenges.includes(ch.id)){
          S.challenges.push(ch.id);
          addXP(40,"challenge solved");
          award("Critic");
          renderNav();
        }
      } else {
        res.textContent=right+"/3 correct — study the notes and try again."; res.style.color="var(--vermilion)";
      }
    });
    list.appendChild(d);
  });
  mount(v);
}

const PG_TYPES = {
  heading:{label:"Heading", make:()=>({type:"heading", text:"Your headline here", size:"m", color:"ink", align:"left"})},
  text:{label:"Paragraph", make:()=>({type:"text", text:"Supporting copy goes here. Keep it short — people scan.", size:"m", color:"muted", align:"left"})},
  button:{label:"Button", make:()=>({type:"button", text:"Primary action", size:"m", color:"accent", align:"left"})},
  input:{label:"Input field", make:()=>({type:"input", text:"Email address", size:"m", color:"ink", align:"left"})},
  image:{label:"Image placeholder", make:()=>({type:"image", text:"image", size:"m", color:"ink", align:"left"})},
  divider:{label:"Divider", make:()=>({type:"divider", text:"", size:"m", color:"ink", align:"left"})}
};
let pgState={device:"mobile", els:[], sel:-1};

function renderPlayground(){
  const v=el(`
    <div class="eyebrow">Build</div>
    <h1>Playground</h1>
    <p class="lede">A wireframing bench. Add elements, click one to select it, tune its hierarchy in the inspector, and flip between mobile and desktop. There's no wrong answer here — this is where lessons become instinct.</p>
    <div class="ctlrow" style="margin-top:18px">
      <div class="seg" style="width:220px">
        <button id="pgMob" class="${pgState.device==='mobile'?'on':''}">mobile · 340px</button>
        <button id="pgDesk" class="${pgState.device==='desktop'?'on':''}">desktop</button>
      </div>
      <button class="btn ghost sm" id="pgClear">Clear canvas</button>
    </div>
    <div class="pg" style="margin-top:16px">
      <div class="palette card" data-xr="element palette · limited choices (Hick's Law)">
        <div class="navlabel" style="padding:0 0 8px">Add element</div>
        ${Object.entries(PG_TYPES).map(([k,t])=>`<button data-add="${k}">+ ${t.label}</button>`).join("")}
        <div style="font-size:11.5px;color:var(--muted);margin-top:10px;font-family:var(--mono)">tip: one heading, one primary button — then squint.</div>
      </div>
      <div><div class="frame ${pgState.device}" id="pgFrame"></div></div>
      <div class="props card" id="pgProps"></div>
    </div>
  `);
  v.querySelector("#pgMob").addEventListener("click",()=>{pgState.device="mobile";renderPlayground();});
  v.querySelector("#pgDesk").addEventListener("click",()=>{pgState.device="desktop";renderPlayground();});
  v.querySelector("#pgClear").addEventListener("click",()=>{pgState.els=[];pgState.sel=-1;renderPlayground();});
  v.querySelector(".palette").addEventListener("click",e=>{
    const b=e.target.closest("[data-add]");
    if(!b) return;
    pgState.els.push(PG_TYPES[b.dataset.add].make());
    pgState.sel=pgState.els.length-1;
    S.pgAdds=(S.pgAdds||0)+1; saveState();
    if(S.pgAdds===5) award("Builder");
    renderPlayground();
  });
  drawCanvas(v);
  drawProps(v);
  mount(v);
}
const PG_COLORS={ink:"#1c1a1a", muted:"#6d6663", accent:"#ec3013"};
const PG_HSIZE={s:"20px", m:"28px", l:"38px"};
const PG_TSIZE={s:"12.5px", m:"14.5px", l:"17px"};
function drawCanvas(v){
  const f=v.querySelector("#pgFrame");
  if(!pgState.els.length){
    f.innerHTML=`<div class="emptycanvas">empty canvas —<br>add elements from the left<br><br>an empty state should always say what to do next. like this one.</div>`;
    return;
  }
  f.innerHTML="";
  pgState.els.forEach((e2,i)=>{
    const d=document.createElement("div");
    d.className="pgel"+(pgState.sel===i?" sel":"");
    d.style.textAlign=e2.align;
    if(e2.type==="heading") d.innerHTML=`<h4 style="font-size:${PG_HSIZE[e2.size]};color:${PG_COLORS[e2.color]}">${esc(e2.text)}</h4>`;
    if(e2.type==="text") d.innerHTML=`<p style="font-size:${PG_TSIZE[e2.size]};color:${PG_COLORS[e2.color]}">${esc(e2.text)}</p>`;
    if(e2.type==="button") d.innerHTML=`<button class="pgbtn" style="background:${PG_COLORS[e2.color]};font-size:${PG_TSIZE[e2.size]};${e2.color==='muted'?'':''}" tabindex="-1">${esc(e2.text)}</button>`;
    if(e2.type==="input") d.innerHTML=`<input placeholder="${esc(e2.text)}" tabindex="-1" style="font-size:${PG_TSIZE[e2.size]}">`;
    if(e2.type==="image") d.innerHTML=`<div class="imgph" style="height:${e2.size==='s'?70:e2.size==='m'?120:190}px">image · ${e2.size.toUpperCase()}</div>`;
    if(e2.type==="divider") d.innerHTML=`<hr class="divl">`;
    d.addEventListener("click",()=>{pgState.sel=i;renderPlayground();});
    f.appendChild(d);
  });
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function drawProps(v){
  const p=v.querySelector("#pgProps");
  const i=pgState.sel;
  if(i<0 || !pgState.els[i]){
    p.innerHTML=`<div class="navlabel" style="padding:0 0 8px">Inspector</div><p style="font-size:13px;color:var(--muted);margin:0">Select an element on the canvas to edit its text, size, color role, and alignment — the same four dials behind most visual hierarchy.</p>`;
    return;
  }
  const e2=pgState.els[i];
  p.innerHTML=`<div class="navlabel" style="padding:0 0 8px">Inspector — ${PG_TYPES[e2.type].label}</div>
    ${e2.type!=="divider"&&e2.type!=="image"?`<div class="ctl">text<input type="text" id="ppText" value="${esc(e2.text)}"></div>`:""}
    <div class="ctl">size<div class="seg" id="ppSize">${["s","m","l"].map(s=>`<button data-v="${s}" class="${e2.size===s?'on':''}">${s.toUpperCase()}</button>`).join("")}</div></div>
    ${e2.type!=="divider"&&e2.type!=="image"?`<div class="ctl">color role<div class="seg" id="ppColor">${["ink","muted","accent"].map(c=>`<button data-v="${c}" class="${e2.color===c?'on':''}">${c}</button>`).join("")}</div></div>
    <div class="ctl">align<div class="seg" id="ppAlign">${["left","center","right"].map(a=>`<button data-v="${a}" class="${e2.align===a?'on':''}">${a}</button>`).join("")}</div></div>`:""}
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn ghost sm" id="ppUp" ${i===0?'disabled':''}>↑</button>
      <button class="btn ghost sm" id="ppDown" ${i===pgState.els.length-1?'disabled':''}>↓</button>
      <button class="btn ghost sm" id="ppDel" style="margin-left:auto;color:var(--vermilion)">delete</button>
    </div>`;
  const rt=p.querySelector("#ppText");
  if(rt) rt.addEventListener("input",()=>{ e2.text=rt.value; drawCanvas(document.getElementById("main").firstChild); });
  [["ppSize","size"],["ppColor","color"],["ppAlign","align"]].forEach(([id,key])=>{
    const seg=p.querySelector("#"+id);
    if(seg) seg.addEventListener("click",ev=>{
      const b=ev.target.closest("[data-v]"); if(!b) return;
      e2[key]=b.dataset.v; renderPlayground();
    });
  });
  p.querySelector("#ppUp").addEventListener("click",()=>{ [pgState.els[i-1],pgState.els[i]]=[pgState.els[i],pgState.els[i-1]]; pgState.sel=i-1; renderPlayground(); });
  p.querySelector("#ppDown").addEventListener("click",()=>{ [pgState.els[i+1],pgState.els[i]]=[pgState.els[i],pgState.els[i+1]]; pgState.sel=i+1; renderPlayground(); });
  p.querySelector("#ppDel").addEventListener("click",()=>{ pgState.els.splice(i,1); pgState.sel=-1; renderPlayground(); });
}

  ["Sketch","The Mac-only pioneer that invented much of the modern workflow. Still around, mostly at Apple-centric shops.","Recognize it; don't prioritize it."],
  ["Penpot","Open-source, self-hostable Figma alternative with growing adoption.","Know it exists for privacy-first teams."],
  ["Framer","Design tool that publishes real, production websites — popular for marketing sites and advanced interactive prototypes.","When a prototype needs to become a real site."],
  ["ProtoPie","High-fidelity prototyping with logic, variables, and device sensors — beyond what Figma can fake.","For testing complex interactions before code."],
  ["Adobe XD","Adobe's former Figma competitor — in maintenance mode since 2023, no active development.","Legacy only. Don't invest learning time."]
]],
["Whiteboard & Workshop",[
  ["Miro","The enterprise infinite whiteboard: workshops, journey maps, retros. FigJam's main rival.","Common in larger orgs and consultancies."],
  ["Whimsical","Fast, opinionated flowcharts, wireframes, and docs.","Lovely for quick user flows."]
]],
["Research & Testing",[
  ["UserTesting","Recruit real people and watch recorded sessions of them attempting your tasks.","The heavyweight for moderated & unmoderated studies."],
  ["Maze","Rapid unmoderated testing wired straight to your Figma prototypes: task success, heatmaps, first clicks.","The quickest loop from prototype to data."],
  ["Optimal Workshop","The classic suite for card sorting, tree testing, and first-click tests.","When the question is information architecture."],
  ["Lookback","Live moderated remote interviews with recording and timestamped notes.","For qualitative depth."],
  ["Hotjar","Heatmaps, scroll maps, and session recordings on live products.","Behavioral evidence at scale, cheaply."],
  ["Dovetail","A research repository: store, tag, and search findings so insights outlive the project.","How mature teams stop re-learning the same lessons."]
]],
["Handoff & Engineering Bridge",[
  ["Figma Dev Mode","Inspect any layer for sizes, tokens, and CSS/iOS/Android snippets.","The current handoff standard."],
  ["Storybook","Where engineers build, document, and test the coded component library.","Learn to read it — it's your system's other half."],
  ["Zeplin","The former handoff king (specs and redlines from design files). Still in some older stacks.","Recognize the name in job posts."]
]],
["Assets & Utilities",[
  ["Google Fonts","Free, production-ready typefaces (this platform's own three come from here).","Default source for web type."],
  ["Lucide / Phosphor / Material Symbols","Open-source icon sets with consistent grids and weights.","Never draw a hamburger icon by hand."],
  ["Unsplash / Pexels","Free high-quality photography for mockups.","Placeholder imagery that doesn't look placeholder."],
  ["Coolors / Realtime Colors","Palette generators and in-context color previews.","Fast exploration before committing tokens."],
  ["WebAIM Contrast Checker / Stark","Contrast math and accessibility linting (Stark plugs into Figma).","The pro versions of this studio's Contrast Lab."]
]],
["Learning & Reference",[
  ["Nielsen Norman Group (NN/g)","Decades of research-backed articles on every UX topic — the field's library of record.","Read one article a day; compound interest for your brain."],
  ["Laws of UX","Beautiful one-page explainers of the psychology in Module 05.","Bookmark it."],
  ["Refactoring UI","The book/site that teaches visual polish to non-visual thinkers.","The fastest 'make it look professional' upgrade."],
  ["Material Design / Apple HIG","The two platform bibles — free masterclasses in systematic design thinking.","Required reading for mobile work (Module 09)."],
  ["The A11y Project / WebAIM","Practical accessibility checklists and patterns.","Companions to Module 12."]
]]
];
function renderTools(){
  const v=el(`
    <div class="eyebrow">Reference</div>
    <h1>Tool Atlas</h1>
    <p class="lede">Every tool you'll hear named in a design job — what it is, and honestly, whether it deserves your time. Pair this with Module 07 for the deep Figma skills.</p>
    <input class="gsearch" id="tq" placeholder="Filter tools… try 'testing' or 'handoff'" style="margin-top:18px">
    <div id="tlist"></div>
  `);
  const draw=q=>{
    const ql=q.toLowerCase();
    v.querySelector("#tlist").innerHTML=TOOLS.map(([cat,items])=>{
      const rows=items.filter(([n,d,w])=>(n+" "+d+" "+w+" "+cat).toLowerCase().includes(ql));
      if(!rows.length) return "";
      return `<h2>${cat}</h2><div class="grid2">`+rows.map(([n,d,w])=>
        `<div class="card"><h3 style="margin-top:0;color:var(--text)">${n}</h3><p style="font-size:13.5px;color:var(--muted);margin-bottom:8px">${d}</p><p style="font-size:12.5px;margin:0;color:var(--peach)"><span style="font-family:var(--mono);font-size:10px;letter-spacing:.1em">WHY IT MATTERS → </span>${w}</p></div>`).join("")+`</div>`;
    }).join("") || `<div class="gterm"><p>No tools match "${esc(q)}".</p></div>`;
  };
  v.querySelector("#tq").addEventListener("input",e=>draw(e.target.value));
  draw("");
  mount(v);
}

function renderGlossary(){
  const v=el(`
    <div class="eyebrow">Reference</div>
    <h1>Glossary</h1>
    <p class="lede">${GLOSSARY.length} terms you'll hear in every design conversation. Search-as-you-type — a small example of instant feedback in action.</p>
    <input class="gsearch" id="gq" placeholder="Filter terms… try 'law' or 'contrast'" style="margin-top:18px">
    <div id="glist"></div>
  `);
  const draw=q=>{
    const list=v.querySelector("#glist");
    const rows=GLOSSARY.filter(([t,d])=>(t+" "+d).toLowerCase().includes(q.toLowerCase()));
    list.innerHTML = rows.length
      ? rows.map(([t,d])=>`<div class="gterm"><b>${t}</b><p>${d}</p></div>`).join("")
      : `<div class="gterm"><p>No terms match "${esc(q)}". Try a shorter word — and notice this empty state tells you what to do next.</p></div>`;
  };
  v.querySelector("#gq").addEventListener("input",e=>draw(e.target.value));
  draw("");
  mount(v);
}

const ALL_BADGES=[
  ["First Steps","Complete your first lesson"],
  ["Quiz Whiz","Score 80%+ on any quiz"],
  ["Lab Rat","Explore all six labs"],
  ["Critic","Solve a critique challenge"],
  ["Builder","Add five elements in the Playground"],
  ["Scholar","Complete every lesson in every module"],
  ["Toolsmith","Complete the full Figma & toolchain module"],
  ["Advocate","Complete the accessibility deep-dive module"]
];
function renderProgress(){
  const {cur,next}=levelInfo();
  const v=el(`
    <div class="eyebrow">Reference</div>
    <h1>My Progress</h1>
    <p class="lede">You are a <strong style="color:var(--peach)">${cur.name}</strong> with ${S.xp} XP${next?` — ${next.at-S.xp} XP to ${next.name}`:" — top of the ladder."}.</p>
    <h2>Modules</h2>
    <div id="modbars"></div>
    <h2>Badges</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap" id="badgerow"></div>
    <h2>Levels</h2>
    <div class="card" style="font-family:var(--mono);font-size:13px;line-height:2">
      ${LEVELS.map(l=>`<div style="${S.xp>=l.at?'color:var(--peach)':'color:var(--muted)'}">${S.xp>=l.at?'●':'○'} ${l.name} — ${l.at} XP</div>`).join("")}
    </div>
    <hr>
    <button class="btn ghost sm" id="resetall">Reset all progress</button>
  `);
  const bars=v.querySelector("#modbars");
  MODULES.forEach(m=>{
    const dl=m.lessons.filter(l=>S.lessons.includes(l.id)).length;
    const quizPct = S.quizzes[m.id]!==undefined ? 1 : 0;
    const pct=Math.round(((dl/m.lessons.length)*0.7+quizPct*0.3)*100);
    const d=document.createElement("div");
    d.style.margin="0 0 14px";
    d.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${m.num} · ${m.title}</span><span style="font-family:var(--mono);color:var(--muted)">${pct}%</span></div><div class="progressline"><i style="width:${pct}%"></i></div>`;
    bars.appendChild(d);
  });
  const br=v.querySelector("#badgerow");
  ALL_BADGES.forEach(([b,desc])=>{
    const won=S.badges.includes(b);
    const s=document.createElement("span");
    s.className="badgechip"+(won?" won":"");
    s.title=desc;
    s.textContent=(won?"★ ":"☆ ")+b;
    br.appendChild(s);
  });
  v.querySelector("#resetall").addEventListener("click",()=>{
    if(confirm("Reset all XP, lessons, quizzes, and badges?")){
      S={xp:0,lessons:[],quizzes:{},labs:[],challenges:[],badges:[],pgAdds:0};
      saveState(); go("home");
    }
  });
  mount(v);
}

document.getElementById("xraytoggle").addEventListener("click",function(){
  const on=document.body.classList.toggle("xray");
  this.classList.toggle("on",on);
  this.setAttribute("aria-pressed",on);
  if(on && !S.badges.includes("X-Ray Vision")){
    // easter egg, not in main badge list
    toast("X-Ray on — the interface is now the lesson");
  }
});

/* boot */
renderXP();
go("home");
</script>
