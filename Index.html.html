<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier/UX — Interactive UI·UX Learning Studio</title>
<meta name="description" content="A self-contained, interactive studio for learning UI/UX design from scratch. Lessons, labs, challenges, and a design playground — no experience required.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1a1a;
  --ink-2:#201e1d;
  --panel:#2d2b2b;
  --panel-2:#343131;
  --line:#605d5d;
  --line-soft:rgba(96,93,93,.45);
  --vermilion:#ec3013;
  --vermilion-deep:#7c1405;
  --peach:#ff9784;
  --cream:#fff2ef;
  --text:#f3f2f2;
  --muted:#a8a3a1;
  --ok:#7fc98f;
  --warn:#e8b64c;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:10px;
  --sp:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--body);
  font-size:15.5px;
  line-height:1.6;
  min-height:100vh;
}
::selection{background:var(--vermilion);color:var(--cream)}
a{color:var(--peach)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--peach);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:60px 1fr;height:100vh}
header.topbar{
  grid-column:1/-1;
  display:flex;align-items:center;gap:20px;
  padding:0 20px;
  background:var(--ink-2);
  border-bottom:1px solid var(--line-soft);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.04em;font-size:17px;white-space:nowrap}
.brand .mark{
  width:26px;height:26px;border:2px solid var(--vermilion);border-radius:6px;
  display:grid;place-items:center;color:var(--vermilion);font-size:12px;font-family:var(--mono);
}
.brand span.ux{color:var(--vermilion)}
.xpwrap{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0}
.levelname{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.xpbar{width:180px;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;border:1px solid var(--line-soft)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--vermilion-deep),var(--vermilion));width:0%;transition:width .5s ease}
.xpnum{font-family:var(--mono);font-size:12px;color:var(--peach);white-space:nowrap}
.xraybtn{
  border:1px solid var(--line);background:transparent;color:var(--text);
  padding:7px 14px;border-radius:99px;font-size:13px;font-family:var(--mono);
  transition:all .2s;white-space:nowrap;
}
.xraybtn:hover{border-color:var(--peach);color:var(--peach)}
.xraybtn.on{background:var(--vermilion);border-color:var(--vermilion);color:var(--cream)}

nav.side{
  background:var(--ink-2);
  border-right:1px solid var(--line-soft);
  overflow-y:auto;
  padding:18px 12px 30px;
}
.navlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.navitem{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:none;color:var(--text);
  text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;
  transition:background .15s;
}
.navitem:hover{background:var(--panel)}
.navitem.active{background:var(--panel);color:var(--peach)}
.navitem .dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none}
.navitem.done .dot{background:var(--ok)}
.navitem.active .dot{background:var(--vermilion)}
.navitem .nnum{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:20px}

main{overflow-y:auto;padding:36px 44px 90px;position:relative}
.view{max-width:900px;margin:0 auto;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- typography ---------- */
h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);line-height:1.12;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
h2{font-family:var(--display);font-size:22px;font-weight:700;margin:34px 0 12px}
h3{font-family:var(--display);font-size:17px;font-weight:500;margin:22px 0 8px;color:var(--peach)}
p{margin-bottom:14px;color:#dcd8d6}
p strong{color:var(--text)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--vermilion);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";height:1px;width:48px;background:var(--vermilion-deep)}
.lede{font-size:17.5px;color:var(--muted);max-width:62ch}

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--vermilion);color:var(--cream);border:none;
  padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;
  transition:transform .12s,filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--peach);color:var(--peach);filter:none}
.btn.sm{padding:6px 13px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tag{font-family:var(--mono);font-size:11px;background:var(--ink);border:1px solid var(--line-soft);border-radius:99px;padding:3px 10px;color:var(--muted)}
.tag.hot{color:var(--peach);border-color:var(--vermilion-deep)}
.callout{
  border-left:3px solid var(--vermilion);background:var(--ink-2);
  padding:14px 18px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;
}
.callout .cl-t{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion);margin-bottom:5px}
.callout p{margin:0;font-size:14.5px}
code{font-family:var(--mono);font-size:.88em;background:var(--ink-2);border:1px solid var(--line-soft);padding:1px 6px;border-radius:5px;color:var(--peach)}
hr{border:none;border-top:1px solid var(--line-soft);margin:28px 0}
.badgechip{display:inline-flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:99px;padding:6px 14px;font-size:13px}
.badgechip.won{border-color:var(--vermilion);color:var(--peach)}
.progressline{height:6px;background:var(--ink);border-radius:99px;overflow:hidden;border:1px solid var(--line-soft)}
.progressline i{display:block;height:100%;background:var(--vermilion)}

/* toast */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:99;
  background:var(--ink-2);border:1px solid var(--vermilion);color:var(--cream);
  padding:12px 18px;border-radius:10px;font-size:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;transform:translateY(12px);transition:all .3s;pointer-events:none;
  font-family:var(--mono);
}
#toast.show{opacity:1;transform:none}

/* ---------- home ---------- */
.hero{padding:26px 0 8px}
.hero h1{max-width:16ch}
.hero h1 em{font-style:normal;color:var(--vermilion)}
.statrow{display:flex;gap:14px;margin:26px 0;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 20px;min-width:140px}
.stat b{font-family:var(--display);font-size:24px;display:block;color:var(--peach)}
.stat span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.pathcard{display:flex;gap:16px;align-items:flex-start;cursor:pointer;transition:border-color .2s,transform .15s;text-align:left;width:100%;color:var(--text);font-family:var(--body)}
.pathcard:hover{border-color:var(--vermilion);transform:translateY(-2px)}
.pathcard .pnum{font-family:var(--mono);color:var(--vermilion);font-size:13px;padding-top:2px}
.pathcard h3{margin:0 0 5px;color:var(--text)}
.pathcard p{font-size:13.5px;color:var(--muted);margin:0}
.pathcard .pmeta{margin-top:10px;display:flex;gap:8px;align-items:center}

/* ---------- lessons ---------- */
.lesson{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:26px 28px;margin-bottom:18px}
.lesson h3{margin-top:0;color:var(--text);font-size:19px}
.lesson .lnum{font-family:var(--mono);font-size:11.5px;color:var(--vermilion);letter-spacing:.12em}
.lesson ul{margin:0 0 14px 20px;color:#dcd8d6}
.lesson li{margin-bottom:6px}
.lesson .demo{background:var(--ink);border:1px dashed var(--line);border-radius:8px;padding:18px;margin:14px 0}
.completerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.completerow .donebadge{color:var(--ok);font-family:var(--mono);font-size:12.5px}

/* quiz */
.quiz .q{margin-bottom:22px}
.quiz .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;font-size:14px}
.opt:hover{border-color:var(--line)}
.opt input{accent-color:var(--vermilion);margin-top:3px}
.opt.correct{border-color:var(--ok)}
.opt.wrong{border-color:var(--vermilion)}
.quizresult{font-family:var(--display);font-size:20px;margin-top:10px}

/* ---------- labs ---------- */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.labcard{cursor:pointer;text-align:left;color:var(--text);transition:border-color .2s,transform .15s;font-family:var(--body)}
.labcard:hover{border-color:var(--vermilion);transform:translateY(-2px)}
.labcard .licon{font-size:26px;margin-bottom:10px}
.labcard h3{margin:0 0 6px;color:var(--text);font-size:16px}
.labcard p{font-size:13px;color:var(--muted);margin:0}
.labpanel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:24px;margin-top:18px}
.ctlrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.ctl input[type=range]{width:180px;accent-color:var(--vermilion)}
.ctl input[type=color]{width:52px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--ink);padding:2px;cursor:pointer}
.ctl select{background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-family:var(--mono);font-size:12.5px}
.bigratio{font-family:var(--display);font-size:46px;font-weight:700;line-height:1}
.passrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pf{font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line-soft)}
.pf.pass{color:var(--ok);border-color:var(--ok)}
.pf.fail{color:var(--vermilion);border-color:var(--vermilion)}
.contrast-preview{border-radius:10px;padding:26px;margin-top:14px;border:1px solid var(--line-soft)}
.typescale-out div{border-bottom:1px dashed var(--line-soft);padding:8px 0;display:flex;align-items:baseline;gap:16px}
.typescale-out .sz{font-family:var(--mono);font-size:11px;color:var(--muted);width:88px;flex:none}
.spacing-demo-card{background:#f3f2f2;color:#1c1a1a;border-radius:12px;max-width:400px;transition:padding .2s}
.spacing-demo-card h4{font-family:var(--display);font-size:19px;margin-bottom:0;transition:margin .2s}
.spacing-demo-card p{color:#555;font-size:13.5px;margin:0;transition:margin .2s}
.spacing-demo-card .sbtn{background:var(--vermilion);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-weight:600;font-size:13px}
.arena{position:relative;height:340px;background:var(--ink);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-top:14px}
.target{position:absolute;border-radius:99px;background:var(--vermilion);border:none;transition:filter .1s}
.target:hover{filter:brightness(1.15)}
.arenamsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:13px;text-align:center;padding:20px}
.hickgrid{display:grid;gap:10px;margin-top:14px}
.hickbtn{background:var(--ink-2);border:1px solid var(--line-soft);color:var(--text);border-radius:8px;padding:12px 8px;font-family:var(--mono);font-size:13px;transition:border-color .1s}
.hickbtn:hover{border-color:var(--peach)}
.swatches{display:flex;gap:0;border-radius:10px;overflow:hidden;height:74px;margin:14px 0;border:1px solid var(--line-soft)}
.swatches div{flex:1;display:flex;align-items:flex-end;padding:6px;font-family:var(--mono);font-size:10px;color:rgba(0,0,0,.55)}
.mockplayer{border-radius:14px;padding:22px;max-width:360px;border:1px solid var(--line-soft)}
.mockplayer .art{height:130px;border-radius:10px;margin-bottom:14px}
.mockplayer h4{font-family:var(--display);font-size:17px}
.mockplayer .sub{font-size:12px;opacity:.7;margin-bottom:14px}
.mockplayer .track{height:5px;border-radius:99px;margin-bottom:14px;position:relative}
.mockplayer .track i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:99px;display:block}
.mockplayer .pbtns{display:flex;gap:10px;align-items:center}
.mockplayer .play{width:44px;height:44px;border-radius:99px;border:none;font-size:15px}

/* ---------- challenges ---------- */
.chmock{border-radius:12px;overflow:hidden;border:1px solid var(--line-soft);margin:16px 0;background:#fff}
.chopt{display:flex;gap:10px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:8px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:14px}
.chopt input{accent-color:var(--vermilion);margin-top:3px}
.chopt.correct{border-color:var(--ok)}
.chopt.wrong{border-color:var(--vermilion)}

/* ---------- playground ---------- */
.pg{display:grid;grid-template-columns:170px 1fr 230px;gap:16px;align-items:start}
.pg .palette button{display:block;width:100%;margin-bottom:8px;background:var(--ink-2);border:1px solid var(--line-soft);color:var(--text);border-radius:8px;padding:9px 10px;font-size:12.5px;text-align:left;transition:border-color .15s}
.pg .palette button:hover{border-color:var(--peach)}
.frame{background:#f3f2f2;border-radius:14px;margin:0 auto;padding:22px;min-height:440px;transition:width .25s;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.frame.mobile{width:340px}
.frame.desktop{width:100%;max-width:640px}
.pgel{border:2px dashed transparent;border-radius:6px;padding:4px;cursor:pointer;transition:border-color .1s;margin-bottom:4px}
.pgel:hover{border-color:#e0b6ad}
.pgel.sel{border-color:var(--vermilion)}
.pgel h4{font-family:var(--display);color:#1c1a1a;line-height:1.2}
.pgel p{color:#4c4846;margin:0;line-height:1.5}
.pgel .pgbtn{border:none;border-radius:8px;font-weight:600;color:#fff;padding:10px 18px}
.pgel input{width:100%;border:1px solid #c9c2bf;border-radius:8px;padding:10px 12px;font-family:var(--body);font-size:14px;background:#fff;color:#1c1a1a}
.pgel .imgph{background:repeating-linear-gradient(45deg,#dcd6d3,#dcd6d3 8px,#d0c9c6 8px,#d0c9c6 16px);border-radius:8px;display:grid;place-items:center;color:#8a827e;font-family:var(--mono);font-size:11px}
.pgel .divl{border:none;border-top:1px solid #c9c2bf;margin:6px 0}
.props{position:sticky;top:0}
.props .ctl{margin-bottom:12px}
.props input[type=text]{background:var(--ink-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;width:100%;font-size:13px;font-family:var(--body)}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--ink-2);border:none;color:var(--muted);padding:7px 4px;font-size:11.5px;font-family:var(--mono)}
.seg button.on{background:var(--vermilion);color:var(--cream)}
.emptycanvas{color:#9a938f;text-align:center;font-family:var(--mono);font-size:12px;padding:60px 20px;border:2px dashed #cfc8c5;border-radius:10px}

/* ---------- glossary ---------- */
.gsearch{width:100%;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:13px 16px;color:var(--text);font-size:15px;font-family:var(--body);margin-bottom:18px}
.gterm{border-bottom:1px solid var(--line-soft);padding:14px 4px}
.gterm b{font-family:var(--display);color:var(--peach)}
.gterm p{margin:4px 0 0;font-size:14px;color:var(--muted)}

/* ---------- x-ray mode (signature) ---------- */
body.xray [data-xr]{position:relative;outline:1px dashed var(--peach);outline-offset:3px}
body.xray [data-xr]::after{
  content:attr(data-xr);
  position:absolute;top:-11px;left:8px;
  background:var(--vermilion);color:var(--cream);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  padding:2px 7px;border-radius:4px;white-space:nowrap;z-index:40;
  pointer-events:none;line-height:1.4;
}
#xraybanner{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--ink-2);border:1px solid var(--vermilion);border-radius:12px;padding:12px 20px;
  font-size:13px;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.55);text-align:center}
body.xray #xraybanner{display:block}
#xraybanner b{color:var(--peach)}

/* responsive */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:60px auto 1fr}
  nav.side{border-right:none;border-bottom:1px solid var(--line-soft);display:flex;overflow-x:auto;padding:8px;gap:4px}
  .navlabel{display:none}
  .navitem{white-space:nowrap;width:auto}
  main{padding:24px 18px 80px}
  .grid2,.grid3{grid-template-columns:1fr}
  .pg{grid-template-columns:1fr}
  .frame.mobile{width:100%}
  .xpbar{width:90px}
  .levelname{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" data-xr="header · 60px fixed height · highest hierarchy">
    <div class="brand"><span class="mark">◎</span>ATELIER<span class="ux">/UX</span></div>
    <div class="xpwrap">
      <span class="levelname" id="levelname">Observer</span>
      <div class="xpbar" data-xr="progress bar · instant feedback"><i id="xpfill"></i></div>
      <span class="xpnum" id="xpnum">0 XP</span>
      <button class="xraybtn" id="xraytoggle" aria-pressed="false" title="Annotate this interface with its own design decisions">◉ X-Ray</button>
    </div>
  </header>

  <nav class="side" id="sidenav" data-xr="sidebar nav · persistent wayfinding" aria-label="Main navigation"></nav>

  <main id="main"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="xraybanner"><b>X-Ray mode:</b> the studio is dissecting its own interface. Every dashed label explains a real design decision on this page — the platform is the first case study.</div>

<script>
"use strict";

/* =====================================================
   STATE & STORAGE
===================================================== */
const LS_KEY = "atelier-ux-progress-v1";
let memStore = null;

function loadState(){
  const blank = {xp:0, lessons:[], quizzes:{}, labs:[], challenges:[], badges:[], pgAdds:0};
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return Object.assign(blank, JSON.parse(raw));
  }catch(e){ if(memStore) return memStore; }
  return blank;
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ memStore = S; }
  renderXP(); renderNav();
}
let S = loadState();

const LEVELS = [
  {at:0,    name:"Observer"},
  {at:120,  name:"Apprentice"},
  {at:300,  name:"Practitioner"},
  {at:560,  name:"Designer"},
  {at:900,  name:"Senior Designer"},
  {at:1300, name:"Design Lead"},
  {at:2000, name:"Principal Designer"}
];
function levelInfo(){
  let cur=LEVELS[0], next=null;
  for(let i=0;i<LEVELS.length;i++){
    if(S.xp>=LEVELS[i].at){cur=LEVELS[i]; next=LEVELS[i+1]||null;}
  }
  return {cur,next};
}
function addXP(n,msg){
  S.xp+=n; saveState();
  toast("+"+n+" XP — "+msg);
}
function award(badge){
  if(!S.badges.includes(badge)){
    S.badges.push(badge); saveState();
    setTimeout(()=>toast("★ Badge earned: "+badge),900);
  }
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
function renderXP(){
  const {cur,next}=levelInfo();
  document.getElementById("levelname").textContent=cur.name;
  document.getElementById("xpnum").textContent=S.xp+" XP";
  const pct = next ? Math.min(100,((S.xp-cur.at)/(next.at-cur.at))*100) : 100;
  document.getElementById("xpfill").style.width=pct+"%";
}

{
  id:"m1", num:"01", title:"Foundations", blurb:"What UI and UX actually mean, how designers think, and why every screen starts with a person — not a pixel.",
  lessons:[
    {id:"m1l1", t:"UI vs UX — two jobs, one goal", html:`
      <p><strong>UX (User Experience)</strong> is how a product <em>feels to use</em> — whether people can find what they need, finish what they came to do, and leave without frustration. <strong>UI (User Interface)</strong> is what they actually see and touch — the buttons, colors, type, and layout that make the experience possible.</p>
      <p>A useful analogy: UX is the architecture of a house (where the rooms go, how you move between them), UI is the interior design (the paint, the fixtures, the door handles). A gorgeous room in the wrong place is still a failure. A perfectly placed room with a broken door handle is too.</p>
      <div class="demo"><strong>Try it right now:</strong> this platform's sidebar is a <em>UX</em> decision (persistent navigation so you never feel lost). The vermilion color of the active item is a <em>UI</em> decision (a visual cue drawing your eye). Toggle <code>X-Ray</code> in the top bar to see more decisions annotated live.</div>`},
    {id:"m1l2", t:"Design is problem-solving, not decoration", html:`
      <p>Beginners often think design starts with "making it pretty." Professionals start with three questions:</p>
      <ul>
        <li><strong>Who</strong> is this for? (A nurse on a night shift reads screens differently than a teenager on a bus.)</li>
        <li><strong>What</strong> are they trying to do? (Every screen should have one primary job.)</li>
        <li><strong>What's in their way?</strong> (Confusion, too many choices, tiny tap targets, unreadable text.)</li>
      </ul>
      <p>Only after answering those do color and type enter the conversation — and by then, most of the decisions make themselves.</p>
      <div class="callout"><div class="cl-t">Studio rule</div><p>If you can't say what problem a design element solves, it's decoration. Decoration is fine — but you should know which is which.</p></div>`},
    {id:"m1l3", t:"The double diamond — how a design project flows", html:`
      <p>Most real projects loosely follow the <strong>double diamond</strong>: two rounds of "go wide, then narrow."</p>
      <ul>
        <li><strong>Discover</strong> — research users, watch them work, collect problems. (Go wide.)</li>
        <li><strong>Define</strong> — pick the one problem worth solving. (Narrow.)</li>
        <li><strong>Develop</strong> — sketch many possible solutions, wireframe, prototype. (Go wide again.)</li>
        <li><strong>Deliver</strong> — test with real people, refine, ship. (Narrow again.)</li>
      </ul>
      <p>Notice that pixels only show up in the second diamond. Half the job is understanding the problem — which is why non-technical backgrounds (teaching, retail, healthcare, writing) are genuinely useful in UX: you've watched real people struggle with real systems.</p>`}

{
  id:"m2", num:"02", title:"Visual Hierarchy & Layout", blurb:"How to control what people see first, second, and third — using size, weight, position, and the most underrated tool in design: empty space.",
  lessons:[
    {id:"m2l1", t:"Hierarchy — directing the eye", html:`
      <p>People don't read screens; they <strong>scan</strong> them. Visual hierarchy is how you choreograph that scan so the most important thing is seen first. Your levers:</p>
      <ul>
        <li><strong>Size</strong> — bigger wins. Headlines beat body text.</li>
        <li><strong>Weight & contrast</strong> — bold, high-contrast elements pull the eye.</li>
        <li><strong>Color</strong> — one accent color on a muted background acts like a spotlight. (Notice how vermilion is used sparingly on this page — that's why it works.)</li>
        <li><strong>Position</strong> — top-left gets seen first in left-to-right languages; screens are often scanned in an F or Z pattern.</li>
        <li><strong>Isolation</strong> — an element surrounded by empty space feels important.</li>
      </ul>
      <div class="callout"><div class="cl-t">The squint test</div><p>Squint at any screen until it blurs. Whatever still stands out is your real hierarchy — whether you intended it or not.</p></div>`},
    {id:"m2l2", t:"Whitespace is not wasted space", html:`
      <p>Empty space (designers say <em>whitespace</em> even when it's dark, like this page) does three jobs: it <strong>groups</strong> related things, <strong>separates</strong> unrelated things, and gives important elements <strong>room to breathe</strong>.</p>
      <p>The grouping effect comes from Gestalt psychology — the <strong>law of proximity</strong>: things near each other are perceived as belonging together. That's why a caption sits close to its image and far from the next section. You don't need boxes and lines to organize a page; distance alone can do it.</p>
      <p>Beginner tell: cramming everything in because "space is available." Professional tell: cutting content until the space works. Head to the <strong>Spacing Lab</strong> to feel the difference with a slider.</p>`},
    {id:"m2l3", t:"Alignment and the invisible grid", html:`
      <p>Almost every polished interface sits on an invisible <strong>grid</strong> — usually 12 columns on desktop — and an invisible <strong>spacing scale</strong>, most commonly multiples of 8px (8, 16, 24, 32…). This platform uses an 8px scale; turn on X-Ray and you'll see it called out.</p>
      <ul>
        <li><strong>Align edges.</strong> Ragged left edges read as sloppy even when no one can say why.</li>
        <li><strong>Pick a scale and stick to it.</strong> Random values (13px here, 22px there) create subtle visual noise.</li>
        <li><strong>Consistency beats cleverness.</strong> If cards have 24px padding, all cards have 24px padding.</li>
      </ul>
      <p>Grids aren't rules for their own sake — they're how a screen made of dozens of parts still reads as one calm, intentional thing.</p>`}
  ],

    {q:"The 'law of proximity' says:", opts:["Important things go top-right","Things placed close together are perceived as related","Text must be near images","Buttons should be near the fold"], a:1, why:"Distance communicates relationships — no boxes required."},
    {q:"A spacing scale (8 / 16 / 24 / 32…) exists mainly to:", opts:["Save file size","Create consistent rhythm and reduce visual noise","Make development slower","Follow Apple's rules"], a:1, why:"Consistent spacing is what makes many parts read as one calm design."},
    {q:"You squint at your design and the cookie banner stands out more than the main headline. That means:", opts:["The design passed the test","Your hierarchy is inverted and needs fixing","Users love cookie banners","Nothing — squinting isn't real"], a:1, why:"Whatever survives the squint IS your hierarchy. Fix it if it's wrong."}

{
  id:"m3", num:"03", title:"Color", blurb:"Building palettes that mean something, using accents with discipline, and making sure everyone — including colorblind and low-vision users — can actually read your work.",
  lessons:[
    {id:"m3l1", t:"How color works in interfaces", html:`
      <p>Interface color isn't about picking pretty combinations — it's a <strong>system of roles</strong>:</p>
      <ul>
        <li><strong>Background / surface</strong> — the quiet majority of every screen (here: near-black ink and charcoal panels).</li>
        <li><strong>Text</strong> — usually 2–3 tiers: primary, secondary/muted, disabled.</li>
        <li><strong>Accent</strong> — one strong color for actions and highlights (here: vermilion <code>#ec3013</code>).</li>
        <li><strong>Semantic</strong> — green = success, amber = caution, red = danger. Don't fight these learned meanings.</li>
      </ul>
      <p>A practical starting recipe is <strong>60 / 30 / 10</strong>: roughly 60% background, 30% surfaces & secondary color, 10% accent. When the accent covers 40% of the screen, it stops being an accent and starts being noise.</p>`},
    {id:"m3l2", t:"HSL — the designer's way to think about color", html:`
      <p>Forget hex codes as random strings. <strong>HSL</strong> breaks any color into three human-readable dials:</p>
      <ul>
        <li><strong>Hue</strong> (0–360°) — which color it is: 0 red, 120 green, 240 blue.</li>
        <li><strong>Saturation</strong> (0–100%) — how vivid vs. gray.</li>
        <li><strong>Lightness</strong> (0–100%) — how close to black or white.</li>
      </ul>
      <p>This makes palette-building mechanical: keep the hue, vary lightness → you get tints and shades that automatically harmonize. Shift the hue ±30° → analogous colors. Jump 180° → a complementary pair. The <strong>Palette Lab</strong> lets you spin these dials and watch a mock app repaint itself live.</p>`},
    {id:"m3l3", t:"Contrast & accessibility — the non-negotiable part", html:`
      <p>Around 1 in 12 men has some form of color-vision deficiency, and everyone's vision degrades with age, glare, and cheap screens. The <strong>WCAG</strong> standard measures text contrast as a ratio:</p>
      <ul>
        <li><strong>4.5:1</strong> minimum for normal body text (Level AA)</li>
        <li><strong>3:1</strong> minimum for large text (18pt+/24px, or 14pt bold)</li>
        <li><strong>7:1</strong> for the stricter AAA level</li>
      </ul>
      <p>Two rules that prevent most accessibility failures: <strong>never use color as the only signal</strong> (pair red errors with an icon and message), and <strong>check your grays</strong> — light-gray-on-white "subtle" text is the most common contrast failure on the web. Prove it to yourself in the <strong>Contrast Lab</strong>.</p>`}
  ],
  quiz:[
    {q:"In the 60/30/10 recipe, the 10 refers to:", opts:["Font size","The accent color's share of the screen","Number of colors allowed","Padding in pixels"], a:1, why:"Accents work through scarcity — about a tenth of the visual field."},
    {q:"To create a lighter tint of your brand color that still harmonizes, you should change its:", opts:["Hue","Saturation only","Lightness","File format"], a:2, why:"Same hue + higher lightness = a tint that automatically belongs to the family."},
    {q:"Minimum WCAG AA contrast for normal body text is:", opts:["2:1","3:1","4.5:1","10:1"], a:2, why:"4.5:1 for normal text; 3:1 is only acceptable for large text."},
    {q:"A form shows errors only by turning the field border red. What's wrong?", opts:["Red is ugly","Color is the only signal — colorblind users may miss it entirely","Borders can't be red","Nothing is wrong"], a:1, why:"Pair color with an icon and a written message."}
  ]

{
  id:"m4", num:"04", title:"Typography", blurb:"Type is 90% of most interfaces. Learn to choose typefaces, build a size scale, and set text that people can read without noticing they're reading.",
  lessons:[
    {id:"m4l1", t:"Choosing typefaces without a design degree", html:`
      <p>You need at most <strong>two</strong> typefaces: a <strong>display face</strong> with personality for headlines (this platform uses Space Grotesk) and a <strong>workhorse body face</strong> built for long reading (here, Public Sans). A third, monospaced face is optional for data and code.</p>
      <ul>
        <li><strong>Sans-serifs</strong> (no little feet on the letters) dominate interfaces — clean at small sizes on screens.</li>
        <li><strong>Serifs</strong> bring editorial, traditional, or premium tone — great for headlines and articles.</li>
        <li><strong>Test the hard letters:</strong> can you tell Il1 and O0 apart? Does it stay readable at 13px?</li>
      </ul>
      <div class="callout"><div class="cl-t">Studio rule</div><p>One typeface used well beats three used carelessly. When in doubt, vary weight and size — not fonts.</p></div>`},
    {id:"m4l2", t:"The type scale — sizes that relate", html:`
      <p>Professional interfaces don't pick sizes at random; they generate them from a <strong>ratio</strong>. Start with body size (16px is the web default) and multiply repeatedly:</p>
      <ul>
        <li><strong>1.2 (minor third)</strong> — calm, dense, good for apps: 16 → 19 → 23 → 28…</li>
        <li><strong>1.333 (perfect fourth)</strong> — clear hierarchy, editorial feel: 16 → 21 → 28 → 38…</li>
        <li><strong>1.618 (golden ratio)</strong> — dramatic, poster-like: 16 → 26 → 42…</li>
      </ul>
      <p>Each step communicates one level of hierarchy: page title, section title, sub-heading, body, caption. The <strong>Type Scale Lab</strong> renders the whole ladder live as you drag the ratio.</p>`},
    {id:"m4l3", t:"Readability — line length, line height, and casing", html:`
      <p>Three settings quietly determine whether text is comfortable:</p>
      <ul>
        <li><strong>Line length:</strong> 45–75 characters per line (about 60 is the sweet spot). Full-width paragraphs on a desktop monitor are exhausting — the eye loses its way traveling back.</li>
        <li><strong>Line height:</strong> around 1.5× the font size for body text; tighter (1.1–1.3) for big headlines.</li>
        <li><strong>Casing:</strong> ALL CAPS SLOWS READING because word shapes disappear — save it for tiny labels with wide letter-spacing (like the eyebrows on this page).</li>
      </ul>
      <p>And the classic beginner miss: <strong>contrast of size</strong>. If your heading is 18px and body is 16px, nobody can tell them apart. Be decisive — hierarchy should be visible from across the room.</p>`}
  ],
  quiz:[
    {q:"A comfortable line length for body text is roughly:", opts:["20–30 characters","45–75 characters","100–140 characters","As wide as the screen"], a:1, why:"Beyond ~75 characters the eye struggles to find the next line."},
    {q:"Body text line-height should usually be about:", opts:["1.0","1.5","2.5","It doesn't matter"], a:1, why:"~1.5× gives lines room without floating apart."},
    {q:"A type scale with ratio 1.333 and 16px body gives a next step of about:", opts:["17px","21px","32px","48px"], a:1, why:"16 × 1.333 ≈ 21.3px."},
    {q:"Why avoid long passages in ALL CAPS?", opts:["It uses more ink","Uniform word shapes make reading slower","Fonts don't support capitals","It's against WCAG"], a:1, why:"We recognize words partly by their silhouettes; caps flatten them."}

{
  id:"m5", num:"05", title:"UX Laws & Psychology", blurb:"A handful of research-backed laws explain most of what makes interfaces feel fast, obvious, and trustworthy. Learn them once, see them everywhere.",
  lessons:[
    {id:"m5l1", t:"Fitts's Law — big and close beats small and far", html:`
      <p><strong>Fitts's Law (1954):</strong> the time to hit a target depends on its <strong>size</strong> and <strong>distance</strong>. Bigger, closer targets are faster and less error-prone. Consequences you'll now notice everywhere:</p>
      <ul>
        <li>Primary buttons are large; destructive ones are smaller and further away.</li>
        <li>Mobile tap targets should be at least ~44×44px — fingers are not cursors.</li>
        <li>Screen edges and corners are effectively infinite targets (your cursor stops there) — which is why menus and close buttons live in corners.</li>
      </ul>
      <p>Don't take it on faith — play the <strong>Fitts's Law Range</strong> in Labs and watch your own reaction times prove it.</p>`},
    {id:"m5l2", t:"Hick's Law & Miller's number — the cost of choice", html:`
      <p><strong>Hick's Law:</strong> decision time grows with the number of options. Every choice you add taxes the user. This is why good onboarding asks one question per screen, and why a menu of 40 items feels like homework.</p>
      <p><strong>Miller's 7±2:</strong> working memory holds roughly 4–7 chunks. That's why phone numbers are chunked (312-555-0134), why navigation bars stay short, and why long forms are split into steps.</p>
      <p>The design move both laws point to is <strong>progressive disclosure</strong>: show the essential few, tuck the rest behind "More". Try the <strong>Hick's Law Timer</strong> in Labs — finding one button among 4 vs. 16 is a felt difference.</p>`},
    {id:"m5l3", t:"Affordance, feedback, and Jakob's Law", html:`
      <p>Three ideas that make interfaces feel "obvious":</p>
      <ul>
        <li><strong>Affordance</strong> — things should look like what they do. Buttons look pressable (raised, filled, rounded); links look clickable; sliders look draggable. When flat design strips these cues too far, users hesitate.</li>
        <li><strong>Feedback</strong> — every action gets an immediate, visible response: buttons depress, saves confirm, loading states appear. Silence after a click reads as "broken." (Notice the XP toast in this platform — that's feedback doing its job.)</li>
        <li><strong>Jakob's Law</strong> — users spend most of their time on <em>other</em> sites, so they expect yours to work the same way. The logo goes top-left and links home; the cart is top-right. Innovate on your product, not on conventions.</li>
      </ul>`}
  ],
  quiz:[
    {q:"Per Fitts's Law, the quickest target to hit is:", opts:["Small and far","Small and close","Large and close","Large and far"], a:2, why:"Size up, distance down = faster, fewer errors."},
    {q:"Hick's Law suggests a settings page with 40 visible toggles should be:", opts:["Alphabetized","Grouped and progressively disclosed","Given brighter colors","Moved to the homepage"], a:1, why:"Reduce simultaneous choices; reveal detail on demand."},
    {q:"A user clicks 'Save' and nothing visibly happens (though it worked). The missing ingredient is:", opts:["Affordance","Feedback","Contrast","A bigger font"], a:1, why:"Every action needs a visible response, or users assume failure."},
    {q:"Jakob's Law argues you should:", opts:["Never innovate","Follow familiar conventions for common patterns","Copy competitors' branding","Put navigation at the bottom"], a:1, why:"Meet expectations on conventions; spend novelty on your actual product."}
  ]
},
{
  id:"m6", num:"06", title:"Practice & Process", blurb:"Wireframes, usability tests, and critique — the working habits that turn knowledge into a portfolio.",
  lessons:[
    {id:"m6l1", t:"Wireframing — designing at low fidelity on purpose", html:`
      <p>A <strong>wireframe</strong> is a deliberately rough blueprint: gray boxes, placeholder text, no colors, no photos. The roughness is the point — it keeps the conversation on <em>structure</em> (what goes where, what's most important) instead of taste ("I don't like that blue").</p>
      <ul>
        <li><strong>Start on paper.</strong> Sketch 6–8 tiny layout variants in ten minutes before committing to one.</li>
        <li><strong>One primary action per screen.</strong> If you can't name it, the screen isn't defined yet.</li>
        <li><strong>Real-ish content beats lorem ipsum</strong> — "Order #4189 · Arriving Thursday" reveals layout problems that fake text hides.</li>
      </ul>
      <p>The <strong>Playground</strong> tab is a mini wireframing bench: stack elements, adjust hierarchy, and try the same screen at mobile and desktop widths.</p>`},
    {id:"m6l2", t:"Usability testing — five users, no lab coat required", html:`
      <p>The most valuable UX skill costs nothing: <strong>watch a real person try to use the thing.</strong> Research by Nielsen suggests about five users uncover most usability problems.</p>
      <ul>
        <li>Give a task, not a tour: "Find and book the cheapest Tuesday flight" — then be quiet.</li>
        <li>Ask them to <strong>think aloud</strong>; the gold is in "hmm, I expected this to…"</li>
        <li>Never explain or defend. If you must explain it, the design failed — and that's a finding, not an insult.</li>
        <li>Watch for the gap between what people <em>say</em> ("that was easy!") and what they <em>did</em> (three wrong clicks and a sigh).</li>
      </ul>`},
    {id:"m6l3", t:"Critique, portfolios, and your next 90 days", html:`
      <p><strong>Learning to see</strong> is the real skill. Build it by critiquing daily: pick any app and ask — what's the visual hierarchy? Where's the accent color spent? What convention does it follow or break? The <strong>Challenges</strong> tab trains exactly this muscle.</p>
      <p>A beginner portfolio needs only <strong>2–3 case studies</strong> that show process, not just screens: the problem → research/assumptions → sketches → final design → what you'd test next. Redesigning a flawed local-business site or a government form beats another imaginary music app.</p>
      <div class="callout"><div class="cl-t">A realistic 90-day path</div><p>Weeks 1–4: finish these modules, run every lab twice. Weeks 5–8: recreate 3 screens you admire, pixel by pixel, in Figma (free). Weeks 9–12: one full case study, tested on two friends, written up honestly.</p></div>`}
  ],
  quiz:[
    {q:"Wireframes are intentionally rough because:", opts:["Designers are lazy","It keeps feedback focused on structure, not taste","Gray is fashionable","Clients prefer it"], a:1, why:"Low fidelity steers the conversation to layout and priority."},
    {q:"During a usability test, the participant is stuck. You should:", opts:["Explain how it works","Stay quiet and note where they struggled","End the session","Give them a hint immediately"], a:1, why:"The struggle IS the data. Explaining destroys it."},
    {q:"About how many test users find the majority of usability problems?", opts:["1","5","50","500"], a:1, why:"Nielsen's classic finding: ~5 users surface most issues."},
    {q:"The strongest beginner portfolio piece shows:", opts:["The most screens","Process — problem, exploration, decisions, and testing","Only the final polished visuals","Famous brand logos"], a:1, why:"Hiring managers hire thinking, not just pixels."}
  ]
}

{
  id:"m7", num:"07", title:"The Modern Toolchain: Figma & Friends", blurb:"The tools working designers actually open every morning — with a deep dive into Figma, the industry's default, and an honest map of everything around it.",
  lessons:[
    {id:"m7l1", t:"Figma — the industry's home base", html:`
      <p><strong>Figma</strong> is where the overwhelming majority of interface design happens today. It runs in the browser, it's free for individuals, and — the feature that ended the tool wars — it's <strong>multiplayer</strong>: your whole team designs in the same file at once, like Google Docs for pixels.</p>
      <p>The landscape around it, honestly mapped:</p>
      <ul>
        <li><strong>Sketch</strong> — the Mac-only pioneer that defined modern UI tools (2010s). Still respected, still used at some Apple-centric shops, but no longer where the industry lives.</li>
        <li><strong>Adobe XD</strong> — effectively discontinued; Adobe stopped active development after its attempted Figma acquisition collapsed in 2023. Don't invest learning time here.</li>
        <li><strong>Penpot</strong> — the open-source Figma alternative. Worth knowing exists; some privacy-conscious teams use it.</li>
      </ul>
      <div class="callout"><div class="cl-t">Studio rule</div><p>Learn Figma deeply and the concepts transfer everywhere — every modern tool copies its vocabulary: frames, components, auto layout, variants.</p></div>
      <p>Inside a Figma file, the hierarchy is: <strong>File → Pages → Frames → Layers</strong>. A <em>frame</em> is a screen or container (what older tools called an artboard) — and unlike a plain group, a frame can clip content, own a layout, and carry constraints. That distinction matters daily.</p>`},
    {id:"m7l2", t:"Auto Layout — the skill that separates beginners from hires", html:`
      <p><strong>Auto Layout</strong> is Figma's system for making designs that <em>respond</em>: buttons that grow with their label, lists that reflow when items are added, cards that stack and space themselves. It's the single most-tested Figma skill in job interviews, and it's really just four decisions:</p>
      <ul>
        <li><strong>Direction</strong> — do children flow horizontally or vertically?</li>
        <li><strong>Gap</strong> — how much space between children?</li>
        <li><strong>Padding</strong> — how much space inside the container's edges?</li>
        <li><strong>Sizing</strong> — does each element <strong>hug</strong> its content, <strong>fill</strong> the container, or stay <strong>fixed</strong>?</li>
      </ul>
      <p>If you've ever heard developers talk about "flexbox," this is the same mental model — which is exactly why auto-layout designs hand off to engineers so cleanly. Go feel it in the <strong>Auto Layout Sandbox</strong> in Labs: same four dials, live result.</p>
      <p>Its sibling concept, <strong>constraints</strong>, controls what happens when a frame resizes: pin a nav bar to the top, a FAB to the bottom-right, let content stretch. Auto layout + constraints = designs that survive contact with real screens.</p>`},
    {id:"m7l3", t:"Components, variants, styles & variables", html:`
      <p>The professional Figma workflow is built on <strong>reuse</strong>:</p>
      <ul>
        <li><strong>Component</strong> — a master element (say, a button). Every copy is an <strong>instance</strong>; edit the master and all instances update. This is how a 200-screen product stays consistent.</li>
        <li><strong>Variants</strong> — one component, many states: primary/secondary, default/hover/disabled, small/medium/large, all switchable from a dropdown.</li>
        <li><strong>Styles</strong> — saved colors, text settings, and effects. Change "brand/primary" once, and every screen using it repaints.</li>
        <li><strong>Variables (tokens)</strong> — the newer, more powerful version of styles: named values like <code>color/bg/surface</code> that can switch en masse for light/dark themes.</li>
      </ul>
      <p>Published to a <strong>team library</strong>, these become a design system other files subscribe to — Module 08's whole subject. The habit to build now: <em>never</em> style the same button by hand twice.</p>`},
    {id:"m7l4", t:"Prototyping, Dev Mode, and the tools around the tool", html:`
      <p><strong>Prototyping in Figma:</strong> draw connections between frames, choose a trigger (tap, hover, delay) and an animation. <strong>Smart Animate</strong> matches layers by name across frames and tweens between them — enough fidelity for most usability tests without writing code.</p>
      <p><strong>Handoff:</strong> <strong>Dev Mode</strong> lets engineers inspect any element for exact sizes, colors, and generated CSS/iOS/Android snippets. This replaced an entire generation of "redline" handoff tools (Zeplin, Avocode) — know the names, they still appear in older job posts.</p>
      <p>The supporting cast every team touches:</p>
      <ul>
        <li><strong>FigJam / Miro</strong> — infinite whiteboards for workshops, flows, and affinity mapping.</li>
        <li><strong>ProtoPie, Principle, Framer</strong> — when a prototype needs logic, sensors, or real code that Figma can't fake.</li>
        <li><strong>Maze, UserTesting, Optimal Workshop, Hotjar</strong> — research and testing (Module 11).</li>
        <li><strong>Storybook</strong> — where engineers keep the <em>coded</em> versions of your components.</li>
      </ul>
      <p>The full annotated directory lives in the <strong>Tool Atlas</strong> tab — and the <strong>Figma Shortcut Trainer</strong> in Labs will drill the muscle memory.</p>`}
  ],
  quiz:[
    {q:"The feature that made Figma the industry standard was primarily:", opts:["Better fonts","Real-time multiplayer collaboration in the browser","It was Mac-only","Its price went up"], a:1, why:"Multiplayer + browser-based killed the file-emailing workflow overnight."},
    {q:"In Figma, editing a component's master will:", opts:["Do nothing to copies","Update every instance of it across your designs","Delete the instances","Only work in Dev Mode"], a:1, why:"That single-source-of-truth link is the entire point of components."},
    {q:"Auto Layout's 'hug' sizing means an element:", opts:["Fills all available space","Stays a fixed pixel size","Shrinks or grows to fit its own content","Centers itself"], a:2, why:"Hug = sized by content; fill = sized by container; fixed = sized by you."},
    {q:"A modern team needs engineer handoff specs. The current standard approach is:", opts:["Email annotated screenshots","Print redlines","Figma Dev Mode inspection","Rebuild everything in XD"], a:2, why:"Dev Mode exposes measurements, tokens, and code snippets directly from the design file."},
    {q:"Which tool should a beginner in 2026 NOT invest learning time in?", opts:["Figma","FigJam","Adobe XD","Storybook basics"], a:2, why:"XD is in maintenance mode — Adobe stopped active development after 2023."}
  ]
},
{
  id:"m8", num:"08", title:"Design Systems", blurb:"How Google, Shopify, and IBM design at the scale of thousands of screens: tokens, components, patterns, and documentation — the grammar of professional product design.",
  lessons:[
    {id:"m8l1", t:"What a design system actually is", html:`
      <p>A <strong>design system</strong> is a product's single source of truth: the tokens, components, patterns, and written rules that let fifty designers and five hundred engineers ship screens that look like one person made them.</p>
      <p>The layer cake, bottom to top:</p>
      <ul>
        <li><strong>Foundations/tokens</strong> — named colors, type scale, spacing scale, radii, shadows.</li>
        <li><strong>Components</strong> — buttons, inputs, cards, modals built from those tokens.</li>
        <li><strong>Patterns</strong> — how components combine: a login flow, a data table with filters, an empty state.</li>
        <li><strong>Documentation</strong> — when to use which, and why. The words matter as much as the pixels.</li>
      </ul>
      <p>Study the public greats — they're free masterclasses: Google's <strong>Material Design</strong>, Apple's <strong>Human Interface Guidelines</strong>, Shopify's <strong>Polaris</strong>, IBM's <strong>Carbon</strong>, Atlassian's system. Reading one cover-to-cover teaches more than most courses.</p>`},
    {id:"m8l2", t:"Atomic design & component anatomy", html:`
      <p>Brad Frost's <strong>atomic design</strong> gives systems a shared vocabulary:</p>
      <ul>
        <li><strong>Atoms</strong> — indivisible bits: a label, an icon, an input.</li>
        <li><strong>Molecules</strong> — small working units: label + input + helper text = a form field.</li>
        <li><strong>Organisms</strong> — substantial sections: a header, a product card grid.</li>
        <li><strong>Templates & pages</strong> — layouts, then layouts with real content.</li>
      </ul>
      <p>Every interactive component also needs its full <strong>state anatomy</strong> designed — not just the pretty default. The professional checklist: <strong>default, hover, focus, active/pressed, disabled, loading, error</strong> — and for containers, the <strong>empty state</strong>. Beginners design one state; systems designers design eight. See and toggle all of them in the <strong>Component States Lab</strong>.</p>`},
    {id:"m8l3", t:"Design tokens & theming", html:`
      <p><strong>Tokens</strong> are named design decisions. The craft is in the naming — two tiers:</p>
      <ul>
        <li><strong>Primitive tokens</strong> describe the value: <code>red-500</code>, <code>space-16</code>, <code>font-size-lg</code>.</li>
        <li><strong>Semantic tokens</strong> describe the <em>job</em> and point at primitives: <code>color/action/primary</code> → red-500; <code>color/bg/surface</code> → gray-900.</li>
      </ul>
      <p>Why bother? Because semantic naming is what makes <strong>theming</strong> nearly free: flip what <code>color/bg/surface</code> points to and the entire product switches to light mode — no screen-by-screen repainting. It's also why rebrands at token-driven companies take weeks, not years.</p>
      <div class="callout"><div class="cl-t">Meta moment</div><p>Open this file's source and you'll find the same idea: CSS variables like <code>--vermilion</code> and <code>--panel</code> drive every color on this page. This platform is token-built.</p></div>`}
  ],
  quiz:[
    {q:"In atomic design, a search field (label + input + button) is a:", opts:["Atom","Molecule","Organism","Template"], a:1, why:"Small functional units composed of atoms are molecules."},
    {q:"A semantic token like color/action/primary is valuable because:", opts:["It's shorter to type","Changing what it points to re-themes the product globally","Engineers can't read hex codes","It renders faster"], a:1, why:"Semantic indirection is what makes theming and rebrands cheap."},
    {q:"Which state is NOT part of a complete button's design?", opts:["Hover","Disabled","Loading","Compiled"], a:3, why:"Default, hover, focus, active, disabled, loading, error — 'compiled' isn't a UI state."},
    {q:"The best free way to study world-class system thinking is:", opts:["Guessing","Reading public systems like Material, HIG, Polaris, and Carbon","Buying stock templates","Only using dribbble"], a:1, why:"The giants publish their reasoning openly — read it."}
  ]
},
{
  id:"m9", num:"09", title:"Responsive, Mobile & Platforms", blurb:"Designing for a world of thumbs, notches, and infinite screen sizes — plus the real differences between iOS and Android conventions.",
  lessons:[
    {id:"m9l1", t:"Responsive design — one design, every width", html:`
      <p><strong>Responsive design</strong> means the layout adapts fluidly to any screen. The working method is <strong>mobile-first</strong>: design the narrow version first (it forces ruthless prioritization), then let the layout <em>earn</em> complexity as space appears.</p>
      <ul>
        <li><strong>Breakpoints</strong> — widths where the layout restructures. Common set: ~600px (tablet), ~900–1024px (small desktop), ~1200px+ (wide). This very platform collapses its sidebar below 900px — resize the window and watch.</li>
        <li><strong>Reflow patterns</strong> — columns stack, nav collapses into menus, side-by-side becomes vertical, tables become cards.</li>
        <li><strong>Fluid, not fixed</strong> — think in percentages and max-widths, not pixel-perfect canvases.</li>
      </ul>
      <p>Drag the width slider in the <strong>Breakpoint Lab</strong> to watch a page restructure itself in real time.</p>`},
    {id:"m9l2", t:"Mobile ergonomics — designing for thumbs", html:`
      <p>Phones aren't small desktops; they're held in hands. Physical facts that drive mobile layout:</p>
      <ul>
        <li><strong>The thumb zone</strong> — the bottom third of the screen is easy; the top corners are a stretch. That's why tab bars, primary actions, and gestures live at the bottom of modern apps.</li>
        <li><strong>Touch targets</strong> — minimum ~44×44pt (Apple) / 48×48dp (Google). Fingers are imprecise and occlude what they touch.</li>
        <li><strong>Reachability beats density</strong> — one comfortable action beats three cramped ones.</li>
        <li><strong>Gestures need visible hints</strong> — swipe-to-delete is fine <em>if</em> something suggests it exists. Invisible gestures are mystery meat.</li>
      </ul>
      <p>Design mobile screens at real size on your actual phone (Figma's mirror app does this) — what looks fine zoomed out on a monitor is often unusable in the hand.</p>`},
    {id:"m9l3", t:"iOS vs Android — respecting the platform", html:`
      <p>Jakob's Law applies per-platform: iPhone users expect iOS conventions (<strong>Human Interface Guidelines</strong>), Android users expect <strong>Material Design</strong>. The differences that actually bite:</p>
      <ul>
        <li><strong>Navigation:</strong> iOS leans on bottom tab bars + left-edge back swipe; Android has a system-wide back gesture and historically more top app bars and drawers.</li>
        <li><strong>Typography:</strong> SF Pro on iOS, Roboto/Google Sans on Android — with different default sizes and weights.</li>
        <li><strong>Controls:</strong> switches, pickers, dialogs, and share sheets all look and behave differently. Using an iOS-style picker on Android reads as "cheap port."</li>
        <li><strong>Dark mode & dynamic type:</strong> both platforms let users demand larger text and dark themes — designs must survive both.</li>
      </ul>
      <p>The professional move: design the <em>flow</em> once, then let each platform's native components express it.</p>`}
  ],
  quiz:[
    {q:"Mobile-first means:", opts:["Only designing for phones","Designing the constrained version first, then expanding","Testing on iPhones before Androids","Making desktop sites smaller"], a:1, why:"Constraint forces prioritization; wider layouts then earn their complexity."},
    {q:"The easiest area for a thumb on a phone is:", opts:["Top-left corner","Top-right corner","The bottom third","The exact center"], a:2, why:"That's why tab bars and primary actions moved to the bottom."},
    {q:"Minimum recommended touch target size is roughly:", opts:["16×16px","24×24px","44–48px","100×100px"], a:2, why:"Apple says 44pt, Google says 48dp — same idea."},
    {q:"Shipping an app with iOS-style controls on Android mainly violates:", opts:["Fitts's Law","Jakob's Law — platform users' learned expectations","Hick's Law","WCAG"], a:1, why:"Users expect their platform's conventions; breaking them reads as broken."}
  ]
},
{
  id:"m10", num:"10", title:"Interaction Design & Motion", blurb:"Microinteractions, animation timing, and the prototyping fidelity ladder — how interfaces come alive without becoming carnival rides.",
  lessons:[
    {id:"m10l1", t:"Microinteractions — the smallest unit of delight", html:`
      <p>A <strong>microinteraction</strong> is a tiny, complete moment: pull-to-refresh, the heart that pops when you like something, a password field revealing its strength. Dan Saffer's anatomy:</p>
      <ul>
        <li><strong>Trigger</strong> — what starts it (a tap, a scroll, an event).</li>
        <li><strong>Rules</strong> — what happens, invisibly.</li>
        <li><strong>Feedback</strong> — what the user sees, hears, or feels.</li>
        <li><strong>Loops & modes</strong> — what changes over time or with repetition.</li>
      </ul>
      <p>Microinteractions carry a shocking share of how "premium" a product feels — and of its personality. The XP toast in this platform's corner is one: trigger (you complete something), rules (bank XP, once), feedback (the toast), loop (levels grow).</p>`},
    {id:"m10l2", t:"Motion principles — timing is everything", html:`
      <p>Animation in interfaces has three legitimate jobs: <strong>orient</strong> (where did that panel come from?), <strong>connect</strong> (this card became that page), and <strong>confirm</strong> (your tap registered). Decoration is a distant fourth.</p>
      <ul>
        <li><strong>Duration:</strong> most UI motion lives between <strong>150–400ms</strong>. Under 100ms reads as instant; over 500ms reads as sluggish. Small elements move faster than large ones.</li>
        <li><strong>Easing:</strong> nothing in nature moves linearly. <strong>Ease-out</strong> (fast start, gentle landing) for things entering; <strong>ease-in</strong> for things leaving; <strong>ease-in-out</strong> for things moving across.</li>
        <li><strong>Choreography:</strong> stagger related items by 20–50ms so they read as a sequence, not an explosion.</li>
        <li><strong>Respect <code>prefers-reduced-motion</code></strong> — vestibular disorders make big motion physically unpleasant. (This platform honors it; check the CSS.)</li>
      </ul>
      <p>Feel the difference between curves yourself in the <strong>Motion & Easing Lab</strong>.</p>`},
    {id:"m10l3", t:"The prototyping fidelity ladder", html:`
      <p>Prototyping isn't one activity — it's a ladder, and skilled designers pick the <em>lowest</em> rung that answers the current question:</p>
      <ul>
        <li><strong>Paper sketches</strong> — is the concept even right? (minutes)</li>
        <li><strong>Clickable wireframes</strong> — does the flow make sense? (hours)</li>
        <li><strong>Hi-fi Figma prototype with Smart Animate</strong> — does it feel right? Can users complete tasks? (days)</li>
        <li><strong>Logic-capable tools (ProtoPie, Framer) or real code</strong> — does the data, input, or sensor behavior work? (when it matters)</li>
      </ul>
      <p>The classic failure is polishing a hi-fi prototype of the wrong idea. Fidelity is a cost — spend it only after cheaper rungs have earned it. As the saying goes: <em>prototype as if you're right, test as if you're wrong.</em></p>`}
  ],
  quiz:[
    {q:"A good default duration for a small UI transition is about:", opts:["50ms","200–300ms","800ms","2 seconds"], a:1, why:"150–400ms is the comfort zone; small elements sit at the fast end."},
    {q:"An element entering the screen should usually use:", opts:["Linear easing","Ease-out (fast start, gentle stop)","Ease-in","No animation ever"], a:1, why:"Ease-out feels responsive on arrival; linear feels robotic."},
    {q:"You want to know if a signup flow's steps make sense. The right fidelity is:", opts:["Polished hi-fi with animations","Clickable wireframes","Production code","A paper sketch of the logo"], a:1, why:"Flow questions need flow-level fidelity — nothing more."},
    {q:"prefers-reduced-motion exists because:", opts:["Animations drain GPUs","Some users experience real discomfort or vertigo from motion","Designers dislike animation","It's an SEO factor"], a:1, why:"It's an accessibility setting — honoring it is non-negotiable."}
  ]
},
{
  id:"m11", num:"11", title:"UX Research Methods", blurb:"Interviews, card sorting, tree tests, A/B tests, journey maps — the full research toolkit, and how to pick the right method for the question.",
  lessons:[
    {id:"m11l1", t:"Choosing a method — the research compass", html:`
      <p>Every method answers a different kind of question. The classic compass has two axes:</p>
      <ul>
        <li><strong>Attitudinal vs behavioral</strong> — what people <em>say</em> vs what they <em>do</em>. (They diverge constantly.)</li>
        <li><strong>Qualitative vs quantitative</strong> — deep <em>why</em> from few people vs measurable <em>what/how many</em> from many.</li>
      </ul>
      <p>Mapping the staples:</p>
      <ul>
        <li><strong>Interviews & diary studies</strong> — attitudinal + qualitative: motivations, context, language.</li>
        <li><strong>Usability tests</strong> — behavioral + qualitative: where the design fails, and why.</li>
        <li><strong>Surveys</strong> — attitudinal + quantitative: how widespread an opinion is.</li>
        <li><strong>Analytics, heatmaps, A/B tests</strong> — behavioral + quantitative: what's actually happening at scale.</li>
      </ul>
      <div class="callout"><div class="cl-t">Studio rule</div><p>"Would you use this?" is a worthless question — people are kind and terrible at predicting themselves. Watch behavior; ask about the past, not the hypothetical future.</p></div>`},
    {id:"m11l2", t:"IA research — card sorting, tree testing, first-click", html:`
      <p>When the question is "how should content be organized?", three cheap, powerful methods apply:</p>
      <ul>
        <li><strong>Card sorting</strong> — users group your content items into piles that make sense to <em>them</em>. <strong>Open</strong> sorts let them name the groups (great for discovering mental models); <strong>closed</strong> sorts test your proposed categories.</li>
        <li><strong>Tree testing</strong> — strip the UI away entirely and ask users to find things in your bare menu structure: "Where would you look to change your billing date?" It isolates the IA from visual design.</li>
        <li><strong>First-click testing</strong> — show a screen, give a task, record only the first click. If the first click is right, users usually succeed; if wrong, they usually fail.</li>
      </ul>
      <p>Tooling: <strong>Optimal Workshop</strong> is the classic for card sorts and tree tests; <strong>Maze</strong> and <strong>UserTesting</strong> run remote unmoderated tests; <strong>Hotjar</strong> shows heatmaps and session recordings; <strong>Dovetail</strong> stores and tags research so it doesn't die in someone's drive.</p>`},
    {id:"m11l3", t:"Synthesis — from sticky notes to decisions", html:`
      <p>Raw research is noise until synthesized. The standard pipeline:</p>
      <ul>
        <li><strong>Affinity mapping</strong> — put every observation on a note (FigJam/Miro shine here), cluster similar ones, name the clusters. Themes emerge that no single interview showed.</li>
        <li><strong>Personas</strong> — condensed, research-based user archetypes. Useful as shared shorthand; dangerous when invented from imagination.</li>
        <li><strong>Journey maps</strong> — a user's steps, thoughts, and emotions across an experience, highlighting the pain points worth fixing.</li>
        <li><strong>Jobs-to-be-done (JTBD)</strong> — reframe features as hires: "I hire this app to make me look prepared in Monday's meeting." It keeps teams anchored to motivation, not demographics.</li>
      </ul>
      <p>The output of synthesis is never a report nobody reads — it's a <strong>prioritized list of design decisions</strong> with evidence attached.</p>`}
  ],
  quiz:[
    {q:"Users tell you they love a feature, but analytics show nobody uses it. This gap is:", opts:["Impossible","The attitudinal vs behavioral divide","A bug in the analytics","Proof surveys are perfect"], a:1, why:"What people say and do routinely diverge — that's why we measure both."},
    {q:"To test whether YOUR proposed menu categories work, use:", opts:["An open card sort","A closed card sort or tree test","A brand survey","A/B testing colors"], a:1, why:"Closed sorts and tree tests validate a proposed structure; open sorts discover new ones."},
    {q:"Affinity mapping is used to:", opts:["Schedule interviews","Cluster raw observations into themes","Pick color palettes","Measure page speed"], a:1, why:"It turns scattered notes into named, shared insights."},
    {q:"The question 'Would you use this feature?' is weak because:", opts:["It's too short","People are poor predictors of their own future behavior","It's illegal in research","Users never answer"], a:1, why:"Ask about past behavior; observe present behavior; distrust predictions."}
  ]
},
{
  id:"m12", num:"12", title:"Accessibility Deep Dive", blurb:"Beyond contrast ratios: keyboards, screen readers, ARIA, and the POUR principles — designing products that work for every body, which turns out to mean better products for everybody.",
  lessons:[
    {id:"m12l1", t:"POUR — the four pillars of WCAG", html:`
      <p>All of WCAG hangs on four requirements. Interfaces must be:</p>
      <ul>
        <li><strong>Perceivable</strong> — information can't depend on one sense: images need alt text, video needs captions, color needs a second channel.</li>
        <li><strong>Operable</strong> — every function works by keyboard alone; nothing traps focus; nothing flashes dangerously; users get enough time.</li>
        <li><strong>Understandable</strong> — plain language, predictable navigation, errors that explain themselves.</li>
        <li><strong>Robust</strong> — semantic, standards-based structure that assistive technologies can parse.</li>
      </ul>
      <p>And drop the mental image of a small "disabled users" segment. Disability is a spectrum of <strong>permanent</strong> (one arm), <strong>temporary</strong> (broken wrist), and <strong>situational</strong> (holding a baby, bright sunlight, loud train). Accessible design is design for your own future self on a bad day.</p>`},
    {id:"m12l2", t:"Keyboards, focus, and screen readers", html:`
      <p>The fastest accessibility audit costs nothing: <strong>unplug your mouse.</strong></p>
      <ul>
        <li><strong>Everything reachable by Tab</strong>, in a logical order that matches the visual order.</li>
        <li><strong>Visible focus</strong> — the outline showing where you are. Deleting it for looks (<code>outline: none</code>) is the web's most common accessibility crime. Tab around this platform: the peach outline is deliberate.</li>
        <li><strong>Skip links</strong> — let keyboard users jump past long navigation.</li>
      </ul>
      <p><strong>Screen readers</strong> (VoiceOver on Apple, NVDA/JAWS on Windows, TalkBack on Android) read structure, not pixels. They live on:</p>
      <ul>
        <li><strong>Semantic headings</strong> in order (h1 → h2 → h3) — blind users navigate by heading list.</li>
        <li><strong>Alt text</strong> that conveys purpose ("Delete invoice", not "trash icon red button image").</li>
        <li><strong>Real buttons and links</strong> — a styled div is invisible to assistive tech.</li>
      </ul>
      <p><strong>ARIA</strong> attributes can add missing semantics — but the first rule of ARIA is <em>don't use ARIA</em> if a native element already does the job.</p>`},
    {id:"m12l3", t:"Accessible components & how to test", html:`
      <p>Where the failures cluster, and the fixes:</p>
      <ul>
        <li><strong>Forms:</strong> every input gets a real, always-visible label (placeholders vanish the moment you type). Errors: in text, next to the field, specific about the fix.</li>
        <li><strong>Color independence:</strong> status shown by color alone (red dot vs green dot) fails ~8% of men — pair with icons or words.</li>
        <li><strong>Motion:</strong> honor reduced-motion; never make animation the only carrier of information.</li>
        <li><strong>Targets & zoom:</strong> 44px minimum targets; layouts must survive 200% browser zoom.</li>
      </ul>
      <p>The testing stack, cheapest first: keyboard-only pass → automated scan (<strong>axe DevTools</strong>, <strong>Lighthouse</strong> — they catch maybe a third of issues) → five minutes with a real screen reader → ideally, testing with disabled users. Then go earn it: the <strong>Accessibility Audit challenge</strong> in the Challenges tab has real failures waiting.</p>`}
  ],
  quiz:[
    {q:"In POUR, requiring captions on video falls under:", opts:["Perceivable","Operable","Understandable","Robust"], a:0, why:"Information can't rely solely on hearing — that's perceivability."},
    {q:"The cheapest meaningful accessibility test is:", opts:["Hiring an agency","Navigating your product by keyboard only","Printing the screens","Asking marketing"], a:1, why:"Tab through everything — failures announce themselves in minutes."},
    {q:"outline: none with no replacement is harmful because:", opts:["It slows rendering","Keyboard users lose the only indicator of where they are","It breaks SEO","Designers prefer shadows"], a:1, why:"No visible focus = keyboard users navigating blind."},
    {q:"The first rule of ARIA is:", opts:["Use it on every element","Don't use it when a native HTML element already provides the semantics","Only use it on buttons","It's required by law"], a:1, why:"Native elements come with free, battle-tested semantics."},
    {q:"Automated tools like axe and Lighthouse catch roughly:", opts:["100% of issues","About a third — the rest needs human testing","Nothing useful","Only color issues"], a:1, why:"Automation is a floor, not a certification."}
  ]
},
{
  id:"m13", num:"13", title:"The Industry: Roles, Teams & Getting Hired", blurb:"Job titles decoded, how design actually fits into product teams and sprints, and the honest playbook for portfolios, interviews, and your first role.",
  lessons:[
    {id:"m13l1", t:"Decoding the job titles", html:`
      <p>The titles overlap messily, but the working taxonomy:</p>
      <ul>
        <li><strong>Product Designer</strong> — the most common title today: end-to-end UX + UI on a product team. If you're aiming at one title, aim here.</li>
        <li><strong>UX Designer / UI Designer</strong> — the split versions: flows & research vs visual & interaction craft. More common at agencies and older orgs.</li>
        <li><strong>UX Researcher</strong> — full-time research: studies, synthesis, insight ops.</li>
        <li><strong>Content Designer / UX Writer</strong> — the words in the interface: labels, errors, empty states. Enormously undervalued leverage.</li>
        <li><strong>Design Systems Designer</strong> — builds and governs the component library.</li>
        <li><strong>DesignOps</strong> — tooling, processes, hiring, rituals that let design teams scale.</li>
      </ul>
      <p>Adjacent and often confused: <strong>graphic/brand designers</strong> (marketing, identity — different craft) and <strong>UX engineers</strong> (the design–code bridge).</p>`},
    {id:"m13l2", t:"How design fits into a product team", html:`
      <p>You'll almost certainly work in a <strong>triad</strong>: a product manager (owns the <em>why/what</em>), an engineering lead (owns the <em>how</em>), and you (own the <em>experience</em>). Most teams run <strong>agile</strong>: work in 1–2 week <strong>sprints</strong>, with designers typically working one sprint ahead of engineering — researching and designing what gets built next.</p>
      <p>Rituals you'll live in:</p>
      <ul>
        <li><strong>Design critique</strong> — structured peer feedback. Give it well: describe what you see, ask about intent, tie feedback to user goals — never "I don't like it."</li>
        <li><strong>Standups, refinement, retros</strong> — the agile heartbeat.</li>
        <li><strong>Handoff & QA</strong> — specs via Dev Mode, then <em>design QA</em>: checking the built product against the design before release. Skipping this is how good designs ship broken.</li>
      </ul>
      <p>The underrated skill: <strong>writing</strong>. Decisions get made in documents and Slack threads. Designers who can argue a case in clear prose punch far above their weight.</p>`},
    {id:"m13l3", t:"Portfolios, interviews, and the first job", html:`
      <p>The hiring loop, demystified:</p>
      <ul>
        <li><strong>Portfolio screen</strong> — 2–3 deep case studies beat 10 shallow ones. Structure each: problem → constraints → process (show the ugly sketches!) → decisions and <em>why</em> → outcome → what you'd do next. Recruiters spend ~2 minutes; make the story skimmable.</li>
        <li><strong>Portfolio walkthrough</strong> — present one project in 15–20 minutes. They're testing communication as much as craft.</li>
        <li><strong>App critique</strong> — "open Spotify and critique it." Everything from the Challenges tab is training for exactly this: hierarchy, conventions, states, accessibility.</li>
        <li><strong>Whiteboard / take-home challenge</strong> — a design problem, live or timed. The evaluation is your <em>process</em>: clarifying questions, stated assumptions, exploring options, reasoning about trade-offs. Never jump straight to drawing screens.</li>
      </ul>
      <p>Breaking in without experience: redesigns with rigor (research a real product's real problem), volunteer for nonprofits, contribute to open-source design, document everything. Stay sharp with NN/g articles, Laws of UX, and by rebuilding interfaces you admire. Your eye develops before your hands — this whole studio has been training the eye.</p>`}
  ],
  quiz:[
